<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>English Vocabulary Practice</title>

<style>
/* Layout: a workbook contents page — name line, then one row per chapter with its progress. */
:root{
  --paper:#F6F8FC; --surface:#FFFFFF; --ink:#18233A; --muted:#5B6782; --line:#D6DDEB;
  --blue:#2350C8; --blue-soft:#E3EAFB; --hl:#FFE066; --good:#1E8A4C; --bad:#C23B3B;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--paper:#0F1626;--surface:#172238;--ink:#E8EDF7;--muted:#9AA6C0;--line:#2B3954;--blue:#7FA2FF;--blue-soft:#1F2D4D;--hl:#8A6F00;--good:#5BD08A;--bad:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{margin:0;font:800 clamp(30px,6vw,42px)/1.05 var(--display);text-wrap:balance}
h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit}
.sub{margin:4px 0 0;color:var(--muted)}
.who{font-size:15px;color:var(--muted)}
.who button{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font:inherit;cursor:pointer}
.grp{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0;overflow:hidden}
.grp+.grp{margin-top:12px}
.grp summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.grp summary::-webkit-details-marker{display:none}
.grp summary::after{content:"Show ▾";grid-column:2;grid-row:1;font:700 15px/1 var(--display);color:var(--blue)}
.grp[open] summary::after{content:"Hide ▴"}
.gname{font:800 23px/1.15 var(--display)}
.grp summary .meta{grid-column:1/-1}
.gbar{grid-column:1/-1;height:6px;background:var(--blue-soft);border-radius:6px;overflow:hidden;display:block}
.gbar i{display:block;height:100%;background:var(--blue)}
.grp .list{padding:0 12px 12px}
.grp .ch{border-width:1px;padding:10px 12px}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ch{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit}
.ch:hover{border-color:var(--blue)}
.num{width:56px;height:50px;border:3px solid var(--ink);display:grid;place-items:center;font:800 26px/1 var(--display)}
.name{font:700 21px/1.15 var(--display)}
.meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:2/-1;height:6px;background:var(--blue-soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.go{font:700 16px/1 var(--display);color:var(--blue)}
.note{font-size:13px;color:var(--muted)}
.note.err{color:var(--bad)}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 200px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:18px}
.btn{border:0;border-radius:12px;padding:12px 20px;font:700 18px/1 var(--display);background:var(--blue);color:var(--surface);cursor:pointer}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:480px){.ch{grid-template-columns:56px minmax(0,1fr)}.go{display:none}.num{width:50px;height:46px;font-size:22px}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cleanName=s=>String(s||"").trim().replace(/[^A-Za-z0-9 _-]/g,"").slice(0,30);
let LEARNER="";try{LEARNER=localStorage.getItem("vocab-learner")||""}catch(e){}
const fmt=s=>{s=Math.round(s||0);if(s<60)return s?s+" sec":"0 min";const m=Math.round(s/60);return m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min"};

const groupOf=c=>c.n>=1000?`Wordly Wise ${Math.floor(c.n/1000)}`:"Vocabulary Book · Chapters 54–61";
let OPEN={};try{OPEN=JSON.parse(localStorage.getItem("home-open")||"{}")}catch(e){}
function row(c,s){
  const seen=s?s.seen:0,pct=Math.round(seen/c.total*100);
  const line=s?`${fmt(s.seconds)} · ${s.questions} questions${s.questions?` · ${Math.round(s.correct/s.questions*100)}% right`:""} · ${seen}/${c.total} seen · ${s.tricky} tricky`:`${c.total} ${c.u}`;
  const short=c.n>=1000?`L${c.n%1000}`:c.n, name=c.n>=1000?`Lesson ${c.n%1000}`:c.t;
  return `<li><a class="ch" href="${c.f}"><span class="num">${short}</span><span><span class="name">${esc(name)}</span><br><span class="meta">${line}</span></span><span class="go">Practise →</span>${s?`<span class="bar"><i style="width:${pct}%"></i></span>`:""}</a></li>`;
}
function render(stats){
  const groups=[];CH.forEach(c=>{const g=groupOf(c);let G=groups.find(x=>x.g===g);if(!G)groups.push(G={g,items:[]});G.items.push(c)});
  $("#main").innerHTML=groups.map(G=>{
    let sec=0,q=0,cor=0,seen=0,total=0,started=0;
    G.items.forEach(c=>{const s=stats&&stats[c.n];total+=c.total;if(s){sec+=s.seconds;q+=s.questions;cor+=s.correct;seen+=s.seen;if(s.seen||s.questions)started++}});
    const open=G.g in OPEN?OPEN[G.g]:groups.length===1;
    const summary=stats?`${G.items.length} ${G.g.startsWith("Wordly")?"lessons":"chapters"} · ${started} started · ${fmt(sec)}${q?` · ${Math.round(cor/q*100)}% right`:""}`:`${G.items.length} ${G.g.startsWith("Wordly")?"lessons":"chapters"}`;
    return `<details class="grp" data-g="${esc(G.g)}"${open?" open":""}><summary><span class="gname">${esc(G.g)}</span><span class="meta">${summary}</span>${stats&&total?`<span class="gbar"><i style="width:${Math.round(seen/total*100)}%"></i></span>`:""}</summary><ul class="list">${G.items.map(c=>row(c,stats&&stats[c.n])).join("")}</ul></details>`}).join("");
  document.querySelectorAll("details.grp").forEach(d=>d.addEventListener("toggle",()=>{OPEN[d.dataset.g]=d.open;try{localStorage.setItem("home-open",JSON.stringify(OPEN))}catch(e){}}));
}
async function load(){
  render(null);
  $("#note").textContent="Loading progress…";
  try{
    const r=await fetch(`${SUPA.url}/rest/v1/vocab_progress?learner=eq.${encodeURIComponent(LEARNER)}&select=chapter,kind,data`,{headers:{apikey:SUPA.key}});
    if(!r.ok)throw new Error("error "+r.status);
    const rows=await r.json(),stats={};
    rows.forEach(({chapter,kind,data})=>{const s=stats[chapter]||(stats[chapter]={seconds:0,questions:0,correct:0,seen:0,tricky:0});
      if(kind==="usage"){s.seconds+=data.seconds||0;s.questions+=data.questions||0;s.correct+=data.correct||0}
      else if(kind==="learner"){s.seen=(data.items||[]).length;s.tricky=(data.tricky||[]).length}});
    render(stats);
    $("#note").className="note";$("#note").textContent=rows.length?"Progress is saved online and adds up across all devices.":"No practice saved yet. Pick a chapter to start.";
  }catch(e){$("#note").className="note err";$("#note").textContent="Couldn’t load progress right now ("+e.message+"). You can still practise; it will be saved when the connection works."}
}
function start(){
  if(!LEARNER){
    $("#who").textContent="";
    $("#main").innerHTML=`<div class="card"><b style="font:700 22px/1.2 var(--display)">Who is practising?</b><p style="margin:0">Type your name once. Your progress is saved online under this name, so you can carry on from any device.</p><form id="f"><input id="nm" maxlength="30" placeholder="Your name" autocomplete="off"><button class="btn">Start</button></form><span class="note">Use the same name every time, on every device.</span></div>`;
    $("#f").onsubmit=e=>{e.preventDefault();const n=cleanName($("#nm").value);if(!n)return;try{localStorage.setItem("vocab-learner",n)}catch(x){}LEARNER=n;start()};
    $("#nm").focus();return;
  }
  $("#who").innerHTML=`Practising as <b>${esc(LEARNER)}</b> · <button id="chg">Change name</button>`;
  $("#chg").onclick=()=>{try{localStorage.removeItem("vocab-learner")}catch(e){}LEARNER="";start()};
  load();
}
