<style>
/* Layout: one workbook column — chapter box header, mode switch, then a single practice card. */
:root{
  --paper:#F6F8FC; --surface:#FFFFFF; --ink:#18233A; --muted:#5B6782; --line:#D6DDEB;
  --blue:#2350C8; --blue-soft:#E3EAFB; --hl:#FFE066;
  --good:#1E8A4C; --good-soft:#DDF3E5; --bad:#C23B3B; --bad-soft:#FBE3E1;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1626; --surface:#172238; --ink:#E8EDF7; --muted:#9AA6C0; --line:#2B3954;
  --blue:#7FA2FF; --blue-soft:#1F2D4D; --hl:#8A6F00;
  --good:#5BD08A; --good-soft:#163828; --bad:#FF8A80; --bad-soft:#3D1D1F; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1626; --surface:#172238; --ink:#E8EDF7; --muted:#9AA6C0; --line:#2B3954;
  --blue:#7FA2FF; --blue-soft:#1F2D4D; --hl:#8A6F00;
  --good:#5BD08A; --good-soft:#163828; --bad:#FF8A80; --bad-soft:#3D1D1F; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
mark{background:linear-gradient(transparent 52%, var(--hl) 52%);color:inherit;padding:0 2px}

/* header */
.head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.head > div:not(.chbox){flex:1 1 200px}
.chbox{flex:none;width:76px;height:68px;border:4px solid var(--ink);display:grid;place-items:center;
  font:800 40px/1 var(--display);letter-spacing:-.02em}
.head h1{margin:0;font:800 clamp(30px,6vw,42px)/1 var(--display);text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.rule{border:2px solid var(--ink);padding:10px 14px;background:var(--surface);font-size:17px}

/* controls */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--blue-soft);padding:5px;border-radius:12px}
.modes button{border:0;background:transparent;padding:10px 6px;border-radius:9px;font:700 16px/1.15 var(--display);color:var(--blue)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar label{font-size:14px;color:var(--muted)}
select,input[type=search]{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
select{max-width:100%}
.grow{flex:1 1 220px}

/* card */
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--blue-soft);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
.sentence{font-size:20px;line-height:1.55;margin:0}
.sentence .blank{display:inline-block;min-width:4em;border-bottom:3px solid var(--blue);color:transparent}
.sentence .target{font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--blue)}
.ask{font:700 22px/1.25 var(--display);margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:19px;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font:700 14px/1 var(--display)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb h3{margin:0;font:800 22px/1.2 var(--display)}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb p{margin:0}
.tip{font-size:15px;color:var(--ink);border-top:1px dashed var(--line);padding-top:8px}
.tip b{color:var(--blue)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font:700 18px/1 var(--display);background:var(--blue);color:var(--surface)}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.say{border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;vertical-align:middle;flex:none}
.say svg{width:18px;height:18px}
.hint{font-size:13px;color:var(--muted);margin:0}

/* flashcard */
.flash{border:2px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;cursor:pointer;background:transparent;width:100%}
.flash .big{font:800 clamp(34px,8vw,52px)/1.05 var(--display);margin:0;overflow-wrap:anywhere}
.flash .eq{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.flash .syn{font:800 clamp(26px,6vw,38px)/1.1 var(--display);color:var(--blue);margin:0}
.flash .mean{margin:0;max-width:52ch}

/* results + list */
.score{font:800 56px/1 var(--display);color:var(--blue);font-variant-numeric:tabular-nums}
.missed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.missed li{border-bottom:1px solid var(--line);padding-bottom:10px}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wl .pair{font-size:18px}
.wl .pair b{font-family:var(--display);font-size:20px}
.wl .pair span{color:var(--blue);font-weight:700}
.wl .m{grid-column:1/-1;font-size:15px;color:var(--muted)}
.star{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:8px}
.star[aria-pressed="true"]{background:var(--hl);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .lab{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .val{font:800 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile .det{font-size:14px;color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{width:100%;min-width:0;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:has(+ tr td[colspan]) td{border-bottom:0}
.tbl td:first-child:not([colspan]){white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.status{margin:-6px 0 0;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.savenote{margin:-10px 0 0;font-size:13px;color:var(--muted)}
.savenote.saved,.savenote.ready{color:var(--good)}
.savenote.error{color:var(--bad)}
.src{font-size:13px;color:var(--muted);margin:0}
#m-progress[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
footer{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  <header class="head">

</div>

<script>
const CHAPTER = {

  title: "Idioms",
  unit: "idioms",
  family: false,
  rule: "An <b>idiom</b> is a <mark>figurative expression</mark>: its meaning is different from the meaning of its words. e.g. It was <b>raining cats and dogs</b> → it was raining very heavily. After winning first prize, he was <b>like a dog with two tails</b> → he was very pleased.",
  pages: "pages 321–326",
  forwardPrompt: (w) => `What does <b>${w}</b> mean in this sentence?`,
  reversePrompt: (m) => `Which idiom means “${m}”?`,
  relation: (w,m) => ``,
  pairWord: "means",
  cardHint: "What does this idiom mean? Tap to check.",
  swapLabel: "",
  joiner: "=",
  rules: {}
};
const ENTRIES = [{"w": "rain cats and dogs", "a": "rain very heavily", "wm": "rain very heavily", "am": "", "s": "We stayed indoors because it was {raining cats and dogs} all afternoon.", "t": "pv", "tag": "rain heavily", "book": "rain heavily", "lit": "Picture cats and dogs tumbling out of the sky! Nobody is sure how this saying began, but it paints a funny picture of very heavy rain."}, {"w": "a dog with two tails", "a": "very happy and pleased", "wm": "very happy and pleased", "am": "", "s": "When Mei Ling won the art prize, she was like {a dog with two tails}.", "t": "pv", "tag": "very happy", "book": "a person who is very pleased", "lit": "A happy dog wags its tail. Imagine a dog so delighted that it would wag two tails if it had them!"}, {"w": "bury the hatchet", "a": "stop quarrelling and make peace", "wm": "stop quarrelling and make peace", "am": "", "s": "After a week of not talking, the two brothers decided to {bury the hatchet}.", "t": "pv", "tag": "make peace", "book": "make peace", "lit": "A hatchet is a small axe. Some Native American peoples buried their hatchets in the ground to show that a fight was over."}, {"w": "keep the ball rolling", "a": "keep something going", "wm": "keep something going", "am": "", "s": "Our class raised $200 for charity, so let's {keep the ball rolling} with a bake sale.", "t": "pv", "tag": "continue", "book": "keep things going", "lit": "Once a ball is rolling, a little push keeps it moving. If everyone stops pushing, it slows down and stops."}, {"w": "by hook or by crook", "a": "in any way possible, whatever it takes", "wm": "in any way possible, whatever it takes", "am": "", "s": "Dad was determined to get us to the airport on time, {by hook or by crook}.", "t": "pv", "tag": "every effort", "book": "by some means no matter what it takes", "lit": "Picture someone trying to reach something with a hook, and if that fails, with a shepherd's crook. Whichever tool works, they will get it!"}, {"w": "burn the candle at both ends", "a": "work too hard and get very tired", "wm": "work too hard and get very tired", "am": "", "s": "Uncle Ravi was {burning the candle at both ends}, working late and waking early every day.", "t": "pv", "tag": "work hard", "book": "work very hard", "lit": "Long ago, candles were precious. Lighting both ends makes a candle burn twice as fast, just as a person who works day and night soon wears out."}, {"w": "have an axe to grind", "a": "have a selfish reason for doing something", "wm": "have a selfish reason for doing something", "am": "", "s": "Be careful when he praises your project; he may {have an axe to grind}.", "t": "pv", "tag": "hidden motive", "book": "have something to gain by an action", "lit": "An old story tells of a man who flattered a boy into turning a grindstone for him. The kind words were only to get his axe sharpened!"}, {"w": "hit below the belt", "a": "do or say something unfair", "wm": "do or say something unfair", "am": "", "s": "Making fun of his stammer during the debate was {hitting below the belt}.", "t": "pv", "tag": "unfair", "book": "act unfairly towards an opponent", "lit": "In boxing, it is against the rules to hit an opponent below the belt. A boxer who does it is fighting unfairly."}, {"w": "a bone to pick", "a": "something you want to complain about to someone", "wm": "something you want to complain about to someone", "am": "", "s": "'I have {a bone to pick} with you,' said Mum. 'Who ate the last curry puff?'", "t": "pv", "tag": "complaint", "book": "say something which may lead to a quarrel", "lit": "Picture two dogs fighting over one bone. If you have a bone to pick with someone, there is something you need to sort out together."}, {"w": "a chip of the old block", "a": "a child who is very like a parent", "wm": "a child who is very like a parent", "am": "", "s": "Ahmad loves fixing things just like his father; he's {a chip off the old block}.", "t": "pv", "tag": "like parent", "book": "extremely like one's father", "lit": "A chip is a small piece cut off a big block of wood or stone. It is made of exactly the same stuff as the block it came from.", "note": "Today people usually say 'a chip off the old block'. It can describe a child who is like either their mother or their father."}, {"w": "kick the bucket", "a": "die (a jokey, informal way to say it)", "wm": "die (a jokey, informal way to say it)", "am": "", "s": "The old printer finally {kicked the bucket}, so Dad had to buy a new one.", "t": "pv", "tag": "die", "book": "die", "lit": "Nobody knows for certain where this phrase comes from, so just remember it as a jokey, slangy way of talking.", "note": "This is an informal, jokey way to say 'die'. It is not polite to use it about someone's real loss, such as a friend's grandparent or pet."}, {"w": "pass the hat round", "a": "collect money from a group of people", "wm": "collect money from a group of people", "am": "", "s": "When our class teacher fell ill, we {passed the hat round} to buy her flowers.", "t": "pv", "tag": "collect money", "book": "ask for donation", "lit": "Street performers would take off their hats and pass them around the crowd, so people could drop coins inside."}, {"w": "call a spade a spade", "a": "say what you think plainly and honestly", "wm": "say what you think plainly and honestly", "am": "", "s": "Grandma always {calls a spade a spade}, so she told me my drawing was messy.", "t": "pv", "tag": "frank", "book": "be very frank and out-spoken", "lit": "A spade is just a spade, so call it that! It means using plain, honest words instead of polite or fancy ones."}, {"w": "throw in the sponge", "a": "give up and admit you have lost", "wm": "give up and admit you have lost", "am": "", "s": "After losing five games in a row, Wei Jie {threw in the sponge} and went home.", "t": "pv", "tag": "give up", "book": "admit defeat", "lit": "In boxing, a trainer throws a sponge (or towel) into the ring to stop the fight and show that their boxer gives up."}, {"w": "leave no stone unturned", "a": "try everything possible to find or do something", "wm": "try everything possible to find or do something", "am": "", "s": "The police {left no stone unturned} in their search for the missing boy.", "t": "pv", "tag": "every effort", "book": "do a job thoroughly", "lit": "Picture someone hunting for lost treasure by turning over every single stone, one by one, until it is found."}, {"w": "a thorn in one's flesh", "a": "someone or something that keeps annoying you", "wm": "someone or something that keeps annoying you", "am": "", "s": "The noisy building works next door have been {a thorn in our flesh} for months.", "t": "pv", "tag": "nuisance", "book": "a nuisance", "lit": "Imagine a thorn stuck in your skin. It is small, but it hurts and bothers you all the time until you get it out."}, {"w": "blow one's own trumpet", "a": "boast about yourself", "wm": "boast about yourself", "am": "", "s": "Jia Hui {blew her own trumpet} about her test results all day.", "t": "pv", "tag": "boast", "book": "boastful", "lit": "Long ago, trumpeters announced the arrival of important people. Blowing your own trumpet means announcing how great you are, all by yourself!"}, {"w": "spin a yarn", "a": "tell a long story, often a made-up one", "wm": "tell a long story, often a made-up one", "am": "", "s": "Grandpa loves to {spin a yarn} about his fishing trips at Changi.", "t": "pv", "tag": "story", "book": "tell a story", "lit": "Yarn is thread spun from wool. Sailors spun yarn while working on ships, and told long stories to pass the time."}, {"w": "come to the point", "a": "say the important thing quickly", "wm": "say the important thing quickly", "am": "", "s": "We don't have much time, so please {come to the point}.", "t": "pv", "tag": "brief", "book": "speak briefly and concisely", "lit": "Picture a long, winding road. Coming to the point means skipping the detours and going straight to the spot that matters."}, {"w": "in a nutshell", "a": "in a few words; briefly", "wm": "in a few words; briefly", "am": "", "s": "{In a nutshell}, the school trip was cancelled because of the rain.", "t": "pv", "tag": "brief", "book": "something expressed in a brief manner", "lit": "A nutshell is tiny! Putting something in a nutshell means squeezing a big idea into a very small space."}, {"w": "pull strings", "a": "ask important people to help you get something", "wm": "ask important people to help you get something", "am": "", "s": "His uncle {pulled strings} to get him a place on the team, which wasn't fair.", "t": "pv", "tag": "use influence", "book": "get the help of high officials to get jobs", "lit": "A puppeteer pulls strings to make a puppet move. Pulling strings means quietly making things happen behind the scenes."}, {"w": "a book worm", "a": "a person who loves reading", "wm": "a person who loves reading", "am": "", "s": "My sister is {a book worm}; she even reads at every meal.", "t": "pv", "tag": "reader", "book": "a person who always reads", "lit": "Some tiny insects really do burrow through old books. A bookworm person 'eats up' books too, but only by reading them!", "note": "Usually written as one word: 'bookworm'."}, {"w": "a cat on hot bricks", "a": "very nervous and unable to keep still", "wm": "very nervous and unable to keep still", "am": "", "s": "Waiting for her exam results, Priya was like {a cat on hot bricks}.", "t": "pv", "tag": "afraid", "book": "very nervous", "lit": "Imagine a cat walking on bricks baked by the hot sun. It would hop and jump about, unable to stay still!"}, {"w": "to bell the cat", "a": "take on a risky job others are afraid to do", "wm": "take on a risky job others are afraid to do", "am": "", "s": "Everyone wanted to complain to the coach, but nobody dared {to bell the cat}.", "t": "pv", "tag": "brave", "book": "to do something dangerous", "lit": "In an old fable, the mice decided to hang a bell on the cat so they would hear it coming. Great idea, but which mouse would dare to do it?"}, {"w": "let the cat out of the bag", "a": "tell a secret by mistake", "wm": "tell a secret by mistake", "am": "", "s": "Tom {let the cat out of the bag} about Mum's surprise birthday party.", "t": "pv", "tag": "reveal secret", "book": "let the secret out", "lit": "One popular story says tricky market sellers put a cat in a bag and pretended it was a piglet. When the cat jumped out, the secret was out!"}, {"w": "lead a cat and dog life", "a": "always quarrel with each other", "wm": "always quarrel with each other", "am": "", "s": "The two neighbours {lead a cat and dog life}, arguing over every little thing.", "t": "pv", "tag": "quarrel", "book": "always quarrel", "lit": "Cats and dogs are often shown chasing and hissing at each other, as if they can never get along."}, {"w": "wild-cat scheme", "a": "a wild, risky plan likely to fail", "wm": "a wild, risky plan likely to fail", "am": "", "s": "Building a raft to cross the reservoir was a {wild-cat scheme}.", "t": "pv", "tag": "risky plan", "book": "rash scheme which will probably fail", "lit": "A wild cat is fierce and impossible to control. A wild-cat scheme is just as wild and is likely to go wrong.", "note": "Also written 'wildcat scheme'."}, {"w": "like a dog in a manger", "a": "stop others enjoying something you don't need", "wm": "stop others enjoying something you don't need", "am": "", "s": "He won't use the bicycle, but he won't lend it either; he's {like a dog in a manger}.", "t": "pv", "tag": "selfish", "book": "prevents others from having what is useless to oneself", "lit": "In an old fable, a dog lay in a cow's feeding box full of hay. It couldn't eat hay, but it barked to stop the hungry cow eating it!"}, {"w": "a red rag to a bull", "a": "something that is sure to make someone angry", "wm": "something that is sure to make someone angry", "am": "", "s": "Talking about the match he lost was like {a red rag to a bull}.", "t": "pv", "tag": "provoke", "book": "something which is done deliberately to anger another person", "lit": "Bullfighters wave a red cape at a bull. In fact, bulls cannot see red well; it is the waving that makes them charge!"}, {"w": "a bull in a china shop", "a": "a very clumsy person", "wm": "a very clumsy person", "am": "", "s": "My little brother ran around the living room like {a bull in a china shop}, knocking things over.", "t": "pv", "tag": "clumsy", "book": "a very clumsy person", "lit": "Picture a huge bull wandering into a shop full of delicate plates and cups. Crash! Smash! Everything would break."}, {"w": "take the bull by its horns", "a": "face a difficulty bravely and directly", "wm": "face a difficulty bravely and directly", "am": "", "s": "Instead of worrying, Siti {took the bull by its horns} and spoke to her teacher.", "t": "pv", "tag": "brave", "book": "meet difficulties or dangers bravely", "lit": "Grabbing an angry bull by its horns is the boldest way to face it. No running away!", "note": "Usually said 'take the bull by the horns'."}, {"w": "a cock and bull story", "a": "a silly story that is hard to believe", "wm": "a silly story that is hard to believe", "am": "", "s": "He told the teacher {a cock and bull story} about a monkey eating his homework.", "t": "pv", "tag": "story", "book": "an incredible story", "lit": "Imagine a silly fable about a talking rooster (a cock) and a bull. Fun to hear, but nobody would believe it really happened!"}, {"w": "chicken-hearted", "a": "easily frightened; not brave", "wm": "easily frightened; not brave", "am": "", "s": "Don't be so {chicken-hearted}; the dog is only wagging its tail.", "t": "pv", "tag": "afraid", "book": "cowardly", "lit": "Chickens flap and squawk at the smallest noise. A person with a chicken's heart gets scared just as easily."}, {"w": "cock sure", "a": "much too sure of yourself", "wm": "much too sure of yourself", "am": "", "s": "Ben was {cock sure} he would win the race, so he didn't practise.", "t": "pv", "tag": "overconfident", "book": "very sure", "lit": "A cock (rooster) struts about proudly as if it owns the farmyard, always sure it is the boss.", "note": "Usually written as one word: 'cocksure'. It describes someone who is too confident, in a way that can annoy others."}, {"w": "put the cart before the horse", "a": "do things in the wrong order", "wm": "do things in the wrong order", "am": "", "s": "Buying the cake before choosing the party date is {putting the cart before the horse}.", "t": "pv", "tag": "wrong order", "book": "do things in the wrong order", "lit": "A horse should pull a cart from the front. Put the cart in front, and the horse can't pull it anywhere!"}, {"w": "crocodile tears", "a": "pretend sadness that is not real", "wm": "pretend sadness that is not real", "am": "", "s": "My brother cried {crocodile tears} so he wouldn't have to wash the dishes.", "t": "pv", "tag": "fake sorrow", "book": "pretence of sorrow", "lit": "Long ago, people believed crocodiles wept while eating their prey. Crocodiles do get watery eyes, but they aren't sad at all!"}, {"w": "like a bear with a sore head", "a": "in a very bad mood", "wm": "in a very bad mood", "am": "", "s": "Dad was {like a bear with a sore head} after the long traffic jam.", "t": "pv", "tag": "angry", "book": "very bad-tempered", "lit": "Imagine a big bear with a headache. It would growl and snap at anyone who came near!"}, {"w": "a fly in the ointment", "a": "one small thing that spoils something good", "wm": "one small thing that spoils something good", "am": "", "s": "The holiday was perfect; the only {fly in the ointment} was the mosquito bites.", "t": "pv", "tag": "spoiler", "book": "an obstacle", "lit": "Ointment is a soothing cream. Just one dead fly in the jar would spoil the whole lot. The idea comes from the Bible."}, {"w": "a bee in one's bonnet", "a": "keep thinking and talking about one idea", "wm": "keep thinking and talking about one idea", "am": "", "s": "Mrs Lim has {a bee in her bonnet} about tidy desks.", "t": "pv", "tag": "obsession", "book": "a crazy idea", "lit": "A bonnet is an old-fashioned hat. Imagine a bee buzzing around inside it. You couldn't think about anything else!"}, {"w": "donkey-work", "a": "the dull, tiring part of a job", "wm": "the dull, tiring part of a job", "am": "", "s": "I did all the {donkey-work} of cutting out shapes while Ali did the fun painting.", "t": "pv", "tag": "dull work", "book": "work that is laborious or menial", "lit": "Donkeys were used to carry heavy loads and do boring, tiring jobs, day after day, without any thanks."}, {"w": "white elephant", "a": "something costly that is of no use", "wm": "something costly that is of no use", "am": "", "s": "That huge exercise machine became a {white elephant}, gathering dust in the storeroom.", "t": "pv", "tag": "useless possession", "book": "useless possession", "lit": "Long ago, a king of Siam gave a white elephant to people he disliked. It was sacred, so they couldn't use it for work, but it cost a fortune to feed."}, {"w": "cook one's goose", "a": "spoil someone's chances", "wm": "spoil someone's chances", "am": "", "s": "Forgetting his project at home really {cooked his goose}.", "t": "pv", "tag": "ruin chances", "book": "spoil one's chances", "lit": "Picture a farmer's prize goose being cooked for dinner. Once it's cooked, it can't lay any more eggs. The chance is gone for good!"}, {"w": "fish in troubled waters", "a": "gain from other people's troubles", "wm": "gain from other people's troubles", "am": "", "s": "Some sellers {fish in troubled waters}, raising prices whenever there's a shortage.", "t": "pv", "tag": "profit from trouble", "book": "obtain personal gain from the troubles of others", "lit": "Fishermen found that fish were easier to catch when the water was stirred up and muddy, because the fish got confused."}, {"w": "lion's share", "a": "the biggest part of something", "wm": "the biggest part of something", "am": "", "s": "My big brother always takes {the lion's share} of the pizza.", "t": "pv", "tag": "biggest part", "book": "largest portion", "lit": "In one of Aesop's fables, a lion hunted with other animals, then kept all the food for himself because he was the strongest."}, {"w": "get one's monkey up", "a": "become angry", "wm": "become angry", "am": "", "s": "Don't keep teasing him, or you'll {get his monkey up}.", "t": "pv", "tag": "angry", "book": "get angry", "lit": "Picture an angry monkey jumping up and down, screeching and waving its arms. That's how some people look when they lose their temper!", "note": "An old-fashioned British expression; you will rarely hear it today."}, {"w": "smell a rat", "a": "feel that something is wrong", "wm": "feel that something is wrong", "am": "", "s": "When the kitchen was suspiciously quiet, Mum {smelt a rat}.", "t": "pv", "tag": "suspicious", "book": "get suspicious", "lit": "A cat can smell a hidden rat before it sees it. In the same way, you can sense something is wrong before you have proof."}, {"w": "scapegoat", "a": "someone blamed for others' mistakes", "wm": "someone blamed for others' mistakes", "am": "", "s": "Ken was made the {scapegoat} for the broken window, though he wasn't even there.", "t": "pv", "tag": "blamed", "book": "person who gets the blame for something he/she did not do", "lit": "In an ancient ceremony in the Bible, a goat was sent away into the wilderness, as if carrying away all the people's wrongdoings."}, {"w": "snake in the grass", "a": "a friend who secretly can't be trusted", "wm": "a friend who secretly can't be trusted", "am": "", "s": "She pretended to be my friend, but she was {a snake in the grass}.", "t": "pv", "tag": "untrustworthy", "book": "person who cannot be trusted", "lit": "A snake hidden in long grass can't be seen until it strikes. A sneaky person hides their true self in the same way."}, {"w": "turn turtle", "a": "turn upside down", "wm": "turn upside down", "am": "", "s": "The small boat {turned turtle} in the strong waves, but everyone swam safely ashore.", "t": "pv", "tag": "overturn", "book": "overturn", "lit": "Sailors caught turtles by flipping them onto their backs. A boat upside down looks just like a turtle lying on its shell."}, {"w": "hornet's nest", "a": "a situation full of trouble and anger", "wm": "a situation full of trouble and anger", "am": "", "s": "By changing the canteen menu, the principal stirred up {a hornet's nest}.", "t": "pv", "tag": "trouble", "book": "source of great trouble", "lit": "Poke a hornet's nest and angry hornets swarm out to sting you. Some actions stir up just as much trouble!"}, {"w": "pass with flying colours", "a": "pass a test with very high marks", "wm": "pass a test with very high marks", "am": "", "s": "Kumar {passed with flying colours} in his piano exam.", "t": "pv", "tag": "do very well", "book": "do very well in a test", "lit": "Long ago, ships that had won a battle sailed back into port with their flags, called colours, flying high."}, {"w": "in black and white", "a": "written down on paper", "wm": "written down on paper", "am": "", "s": "The rules are {in black and white}, so no one can argue about them.", "t": "pv", "tag": "in writing", "book": "written down on paper", "lit": "Picture black ink on white paper. Once something is written down, everyone can see it clearly."}, {"w": "have green eyes", "a": "be jealous", "wm": "be jealous", "am": "", "s": "Seeing my new bicycle, my cousin couldn't hide that he {had green eyes}.", "t": "pv", "tag": "jealous", "book": "be jealous", "lit": "Shakespeare called jealousy 'the green-eyed monster'. Being jealous is like having that monster look out through your eyes.", "note": "People more often say 'green-eyed' or 'green with envy'."}, {"w": "greenhorn", "a": "someone new and without experience", "wm": "someone new and without experience", "am": "", "s": "I'm a {greenhorn} at badminton, so please be patient with me.", "t": "pv", "tag": "beginner", "book": "inexperienced person", "lit": "Young cattle have fresh, new horns. A greenhorn is someone new at something, just starting out."}, {"w": "once in a blue moon", "a": "very rarely", "wm": "very rarely", "am": "", "s": "My cousin from London visits us only {once in a blue moon}.", "t": "pv", "tag": "rarely", "book": "very, very seldom", "lit": "A 'blue moon' is an extra full moon that comes only every two or three years. It isn't really blue, just rare!"}, {"w": "caught red-handed", "a": "caught while doing something wrong", "wm": "caught while doing something wrong", "am": "", "s": "The monkey was {caught red-handed} stealing bananas from our picnic.", "t": "pv", "tag": "caught in act", "book": "caught in the act of a crime", "lit": "Picture someone caught with the proof still on their hands, like red jam on their fingers next to the empty jar!"}, {"w": "see red", "a": "become very angry", "wm": "become very angry", "am": "", "s": "When someone pushed in front of the queue, Grandpa {saw red}.", "t": "pv", "tag": "angry", "book": "be very angry", "lit": "Picture anger rising so strongly that everything in front of your eyes seems to turn red!"}, {"w": "white lie", "a": "a small harmless lie told to be kind", "wm": "a small harmless lie told to be kind", "am": "", "s": "I told {a white lie} and said I loved Auntie's knitted sweater.", "t": "pv", "tag": "harmless lie", "book": "harmless lie", "lit": "White is often linked with innocence. A white lie is told to be kind, not to cause harm."}, {"w": "turn over a new leaf", "a": "change and start behaving better", "wm": "change and start behaving better", "am": "", "s": "After being late for school so often, Danial decided to {turn over a new leaf}.", "t": "pv", "tag": "do better", "book": "reform", "lit": "A leaf is a page of a book. Turning to a fresh, clean page means starting again without your old mistakes."}, {"w": "a bed of roses", "a": "an easy, comfortable situation", "wm": "an easy, comfortable situation", "am": "", "s": "Being a nurse is not {a bed of roses}; it is very hard work.", "t": "pv", "tag": "easy", "book": "very comfortable", "lit": "Imagine lying on soft, sweet-smelling rose petals. Of course, real roses have thorns, so no bed of roses is perfect!", "note": "Often used in the negative: 'Life is not a bed of roses.'"}, {"w": "apple of one's eye", "a": "someone you love very much", "wm": "someone you love very much", "am": "", "s": "Little Mei is {the apple of her grandfather's eye}.", "t": "pv", "tag": "favourite", "book": "favoured person", "lit": "Long ago, the pupil in the middle of the eye was called the 'apple'. It is precious, so you protect it carefully."}, {"w": "sow the seed", "a": "start an idea in someone's mind", "wm": "start an idea in someone's mind", "am": "", "s": "A visit to the zoo {sowed the seed} of Ali's dream to become a vet.", "t": "pv", "tag": "start idea", "book": "give the idea", "lit": "A farmer plants a tiny seed that grows into a big plant. An idea can start small and grow too."}, {"w": "go to the root of the problem", "a": "find the real cause of a problem", "wm": "find the real cause of a problem", "am": "", "s": "To stop the leak for good, the plumber had to {go to the root of the problem}.", "t": "pv", "tag": "find cause", "book": "find out the source of the problem", "lit": "Pulling off a weed's leaves won't stop it growing back. You have to dig out the root!"}, {"w": "beat about the bush", "a": "avoid saying something directly", "wm": "avoid saying something directly", "am": "", "s": "Stop {beating about the bush} and tell me what happened to my phone.", "t": "pv", "tag": "avoid point", "book": "talk in a roundabout way", "lit": "Hunters had helpers beat the bushes to scare out birds, instead of going straight for the birds themselves."}, {"w": "nip it in the bud", "a": "stop a problem before it grows", "wm": "stop a problem before it grows", "am": "", "s": "The teacher spotted the teasing and {nipped it in the bud} before it got worse.", "t": "pv", "tag": "stop early", "book": "stop something negative from developing further", "lit": "Gardeners pinch off a bud before it can grow into a flower or branch they don't want."}, {"w": "do something in cold blood", "a": "cruelly, without any feeling", "wm": "cruelly, without any feeling", "am": "", "s": "In the fairy tale, the wicked queen {did it in cold blood}, without feeling sorry at all.", "t": "pv", "tag": "cruel", "book": "act without feelings", "lit": "People once believed blood heated up when you were angry or excited. Cold blood means acting calmly, with no feeling at all."}, {"w": "blood is thicker than water", "a": "family matters more than others", "wm": "family matters more than others", "am": "", "s": "Even though they quarrel, the twins always help each other; {blood is thicker than water}.", "t": "pv", "tag": "family first", "book": "one usually takes the side of one's relations", "lit": "Blood stands for family. The saying means family ties are stronger than other bonds."}, {"w": "an eye for an eye", "a": "paying back harm with the same harm", "wm": "paying back harm with the same harm", "am": "", "s": "Hitting him back isn't the answer; {an eye for an eye} only makes things worse.", "t": "pv", "tag": "revenge", "book": "return evil for evil", "lit": "This comes from very old laws: if someone hurt your eye, their punishment was to lose an eye too."}, {"w": "keep an eye on", "a": "watch carefully", "wm": "watch carefully", "am": "", "s": "Please {keep an eye on} your little sister at the playground.", "t": "pv", "tag": "watch", "book": "watch carefully", "lit": "Imagine leaving one of your eyes behind to watch something while you do other things!"}, {"w": "see eye to eye", "a": "agree with someone", "wm": "agree with someone", "am": "", "s": "My brother and I don't always {see eye to eye} about which show to watch.", "t": "pv", "tag": "agree", "book": "agree with", "lit": "Picture two people looking straight into each other's eyes, seeing things exactly the same way."}, {"w": "turn a blind eye", "a": "pretend not to notice something", "wm": "pretend not to notice something", "am": "", "s": "Mum {turned a blind eye} to the mess because it was my birthday.", "t": "pv", "tag": "ignore", "book": "pretend not to see", "lit": "A famous story says Admiral Nelson held his telescope to his blind eye so he could 'not see' a signal telling him to stop fighting."}, {"w": "eye wash", "a": "something meant to fool people", "wm": "something meant to fool people", "am": "", "s": "The company's promise to plant trees was just {eye wash} to look good.", "t": "pv", "tag": "trick", "book": "deceit", "lit": "Eyewash is a liquid for rinsing your eyes. Picture someone splashing it in your eyes so you can't see what is really going on.", "note": "Usually written as one word, 'eyewash'. It is a rather old-fashioned word."}, {"w": "in a twinkling of an eye", "a": "very quickly", "wm": "very quickly", "am": "", "s": "{In a twinkling of an eye}, the cookies on the plate were gone.", "t": "pv", "tag": "quickly", "book": "very quickly", "lit": "A twinkle or blink of an eye takes only a tiny part of a second. Something that happens that fast is almost instant!", "note": "Usually said 'in the twinkling of an eye' or 'in the blink of an eye'."}, {"w": "save face", "a": "avoid looking foolish in front of others", "wm": "avoid looking foolish in front of others", "am": "", "s": "To {save face}, Jun said he had lost the race on purpose.", "t": "pv", "tag": "avoid shame", "book": "save oneself from shame", "lit": "In Chinese and other Asian cultures, 'face' means your pride and good name. Saving face keeps others from thinking less of you."}, {"w": "face the music", "a": "accept punishment for what you did", "wm": "accept punishment for what you did", "am": "", "s": "I broke the vase, so I had to {face the music} when Dad came home.", "t": "pv", "tag": "accept punishment", "book": "take scolding or punishment without complaint", "lit": "Nobody is sure of the real origin. Picture standing right in front of a loud band. You can't run away; you just have to face it!"}, {"w": "smack one's lip", "a": "show you are eager to enjoy something", "wm": "show you are eager to enjoy something", "am": "", "s": "Ah Boy {smacked his lips} as Grandma served the chicken rice.", "t": "pv", "tag": "look forward", "book": "express pleasure", "lit": "When we see tasty food, we sometimes press our lips together and open them with a smacking sound.", "note": "Usually 'smack one's lips'. It can also mean looking forward eagerly to something nice."}, {"w": "lead by the nose", "a": "control someone completely", "wm": "control someone completely", "am": "", "s": "Don't let your friends {lead you by the nose}; think for yourself.", "t": "pv", "tag": "control", "book": "lead blindly", "lit": "Bulls and oxen sometimes have a ring through their nose, so a farmer can lead them anywhere easily."}, {"w": "pay through the nose", "a": "pay far too much for something", "wm": "pay far too much for something", "am": "", "s": "We {paid through the nose} for drinks at the theme park.", "t": "pv", "tag": "pay too much", "book": "pay too much for something", "lit": "Nobody knows for sure how this began. Picture paying so much that it really hurts, right up to your nose!"}, {"w": "live from hand to mouth", "a": "have just enough money to live day by day", "wm": "have just enough money to live day by day", "am": "", "s": "Before he found a job, Mr Tan's family {lived from hand to mouth}.", "t": "pv", "tag": "money", "book": "live for the present with no thought of the future", "lit": "Picture someone who gets just enough food in their hand to put straight into their mouth, with nothing left to save."}, {"w": "not turn a hair", "a": "stay completely calm", "wm": "stay completely calm", "am": "", "s": "When a lizard ran across the table, Grandma {didn't turn a hair}.", "t": "pv", "tag": "calm", "book": "remain calm", "lit": "A calm horse doesn't sweat, so its hair stays smooth. A frightened horse gets damp and ruffled."}, {"w": "hit the nail on the head", "a": "say exactly the right thing", "wm": "say exactly the right thing", "am": "", "s": "You've {hit the nail on the head}; the problem is that we started too late.", "t": "pv", "tag": "exactly right", "book": "do or say the right thing", "lit": "If you hit a nail exactly on its head with a hammer, it goes in straight. Miss, and you bend it!"}, {"w": "hold one's tongue", "a": "stay quiet and say nothing", "wm": "stay quiet and say nothing", "am": "", "s": "I wanted to argue, but I {held my tongue} and listened.", "t": "pv", "tag": "keep quiet", "book": "keep quiet", "lit": "Picture holding your tongue still with your fingers. You couldn't say a single word!"}, {"w": "have a sweet tooth", "a": "love eating sweet food", "wm": "love eating sweet food", "am": "", "s": "Auntie {has a sweet tooth}, so she always orders chendol after dinner.", "t": "pv", "tag": "sweets", "book": "like sweet things", "lit": "Imagine one of your teeth only wanting sweet things: cake, kueh and ice cream!"}, {"w": "have no backbone", "a": "not brave enough to stand up for yourself", "wm": "not brave enough to stand up for yourself", "am": "", "s": "He {has no backbone}; he always agrees with whoever is loudest.", "t": "pv", "tag": "weak-willed", "book": "have no will of one's own", "lit": "Your backbone holds you up straight. Without one, you would flop over, just like someone who gives in to everyone."}, {"w": "talk behind one's back", "a": "say unkind things about someone not there", "wm": "say unkind things about someone not there", "am": "", "s": "She was hurt to find out her friends had {talked behind her back}.", "t": "pv", "tag": "gossip", "book": "talk without one's knowing", "lit": "Picture people whispering about you after you have turned away, so you can't hear them."}, {"w": "back out", "a": "decide not to do something you agreed to", "wm": "decide not to do something you agreed to", "am": "", "s": "Jason promised to sing in the concert but {backed out} at the last moment.", "t": "pv", "tag": "break promise", "book": "withdraw from an agreement", "lit": "Picture someone stepping backwards out of a room they had agreed to go into.", "note": "'Back out' is also a phrasal verb. You will meet it again in the phrasal verbs chapter."}, {"w": "make a clean breast of", "a": "confess everything", "wm": "confess everything", "am": "", "s": "Ling {made a clean breast of} breaking the vase.", "t": "pv", "tag": "confess", "book": "confess all", "lit": "Long ago, people thought the breast (chest) held your secrets and feelings. Making it 'clean' means getting everything off your chest."}, {"w": "give the cold shoulder", "a": "treat someone in an unfriendly way on purpose", "wm": "treat someone in an unfriendly way on purpose", "am": "", "s": "After our argument, Hui Min {gave me the cold shoulder} all week.", "t": "pv", "tag": "distant", "book": "make someone feel unwelcome", "lit": "Picture someone turning their shoulder towards you instead of their face. They are shutting you out."}, {"w": "put one's shoulder to the wheel", "a": "work very hard to get something done", "wm": "work very hard to get something done", "am": "", "s": "Everyone {put their shoulder to the wheel} to finish the class mural.", "t": "pv", "tag": "work hard", "book": "work very hard to succeed", "lit": "When a cart got stuck in the mud, people would push against the wheel with their shoulders to get it moving again."}, {"w": "receive with open arms", "a": "welcome someone warmly", "wm": "welcome someone warmly", "am": "", "s": "Our new classmate from Malaysia was {received with open arms}.", "t": "pv", "tag": "welcome", "book": "welcome warmly", "lit": "Picture someone opening their arms wide to give you a big hug as you arrive."}, {"w": "take up arms", "a": "get ready to fight or go to war", "wm": "get ready to fight or go to war", "am": "", "s": "In the story, the villagers {took up arms} to protect their land.", "t": "pv", "tag": "fight", "book": "go to war", "lit": "'Arms' here means weapons. Long ago, people picked up their weapons when it was time to fight."}, {"w": "keep at arm's length", "a": "avoid getting too close or friendly with someone", "wm": "avoid getting too close or friendly with someone", "am": "", "s": "I {keep him at arm's length} because he likes to start fights.", "t": "pv", "tag": "distant", "book": "avoid becoming too familiar", "lit": "Stretch out your arm. Keeping someone that far away means they can never get too close."}, {"w": "knuckle under", "a": "give in and do what you are told", "wm": "give in and do what you are told", "am": "", "s": "After a long argument, Ravi {knuckled under} and tidied his room.", "t": "pv", "tag": "give up", "book": "give way", "lit": "Long ago, 'knuckle' also meant the knee joint. Picture someone bending their knee to bow to a stronger person."}, {"w": "lend a hand", "a": "help someone", "wm": "help someone", "am": "", "s": "Could you {lend a hand} with these heavy grocery bags?", "t": "pv", "tag": "help", "book": "help", "lit": "Picture giving someone your hand to use for a while, and then getting it back!"}, {"w": "light-fingered", "a": "likely to steal things", "wm": "likely to steal things", "am": "", "s": "The shop owner suspected that one customer was {light-fingered}.", "t": "pv", "tag": "steal", "book": "have tendency to steal", "lit": "Picture quick, light fingers that slip things into a pocket without anyone noticing."}, {"w": "at one's finger tips", "a": "know something very well", "wm": "know something very well", "am": "", "s": "Our quizmaster has every country's capital {at his finger tips}.", "t": "pv", "tag": "know well", "book": "know something thoroughly", "lit": "Things at your fingertips are right there, ready to use in an instant, like the keys on a keyboard.", "note": "Usually written 'at one's fingertips'."}, {"w": "to have a finger in every pie", "a": "be involved in many different things", "wm": "be involved in many different things", "am": "", "s": "Aunty Rose {has a finger in every pie}: she runs the choir, the fair and the library.", "t": "pv", "tag": "involved", "book": "to be involved in too many activities", "lit": "Picture someone poking a finger into every pie on the table, wanting a taste of everything."}, {"w": "thick-skinned", "a": "not easily upset by criticism", "wm": "not easily upset by criticism", "am": "", "s": "You need to be {thick-skinned} to be a referee, because people shout at you.", "t": "pv", "tag": "not easily hurt", "book": "insensitive", "lit": "Animals like rhinos have very thick skin, so small scratches and bites don't bother them."}, {"w": "save one's skin", "a": "save yourself from danger or trouble", "wm": "save yourself from danger or trouble", "am": "", "s": "The fox in the story ran away to {save his own skin}, leaving his friends behind.", "t": "pv", "tag": "escape", "book": "save oneself from harm or injury", "lit": "Your skin covers your whole body. Saving it means keeping yourself safe from harm."}, {"w": "get cold feet", "a": "suddenly become too scared to do something planned", "wm": "suddenly become too scared to do something planned", "am": "", "s": "Lina wanted to join the talent show, but she {got cold feet} at the last minute.", "t": "pv", "tag": "afraid", "book": "be afraid", "lit": "When people are frightened, their feet may feel cold and stuck, as if they can't step forward."}, {"w": "stand on one's own feet", "a": "look after yourself without help", "wm": "look after yourself without help", "am": "", "s": "After finishing university, my cousin learnt to {stand on her own feet}.", "t": "pv", "tag": "independent", "book": "be independent", "lit": "A baby needs to be held up, but as you grow, you learn to stand all by yourself."}, {"w": "foot the bill", "a": "pay for something", "wm": "pay for something", "am": "", "s": "Grandpa {footed the bill} for our family dinner.", "t": "pv", "tag": "pay", "book": "pay the bill", "lit": "The total of a bill is written at the bottom, or 'foot', of the page. The person paying signs at the foot."}, {"w": "put your best foot forward", "a": "try your very best", "wm": "try your very best", "am": "", "s": "On your first day at the new school, {put your best foot forward}.", "t": "pv", "tag": "do better", "book": "do your very best", "lit": "Picture stepping forward with your stronger foot first, to make the best possible start."}, {"w": "take to one's heel", "a": "run away quickly", "wm": "run away quickly", "am": "", "s": "When the dog barked, the naughty boys {took to their heels}.", "t": "pv", "tag": "run away", "book": "run away very quickly", "lit": "Picture someone running so fast that all you can see are their heels as they disappear!", "note": "Usually said with 'heels': 'take to one's heels'."}, {"w": "cool one's heel", "a": "be kept waiting", "wm": "be kept waiting", "am": "", "s": "We {cooled our heels} at the clinic for over an hour.", "t": "pv", "tag": "wait", "book": "wait", "lit": "After a long walk your feet feel hot. Waiting a long time gives them plenty of time to cool down!", "note": "Usually said with 'heels': 'cool one's heels'."}, {"w": "hard of hearing", "a": "not able to hear well", "wm": "not able to hear well", "am": "", "s": "Please speak clearly to Grandma; she is a little {hard of hearing}.", "t": "pv", "tag": "cannot hear well", "book": "almost deaf", "lit": "This simply means that hearing is hard for someone. It is a kind, polite way to describe it.", "note": "A polite, gentle way to say that someone cannot hear well."}, {"w": "keep in mind", "a": "remember something", "wm": "remember something", "am": "", "s": "{Keep in mind} that the library closes at five o'clock.", "t": "pv", "tag": "remember", "book": "remember", "lit": "Picture your mind as a box where you store important things so they don't get lost."}, {"w": "keep up appearances", "a": "pretend everything is fine when it isn't", "wm": "pretend everything is fine when it isn't", "am": "", "s": "Even after losing his job, Mr Lee {kept up appearances} by wearing his suit every day.", "t": "pv", "tag": "pretend", "book": "make things look seemingly well when they are not", "lit": "Appearances are how things look on the outside. Keeping them up is like painting a cracked wall so no one sees the cracks."}, {"w": "be run down", "a": "feel weak, tired and a bit unwell", "wm": "feel weak, tired and a bit unwell", "am": "", "s": "After weeks of exams, Farah {was run down} and caught a cold.", "t": "pv", "tag": "tired", "book": "be weak or exhausted", "lit": "Picture a toy whose battery is almost flat. It slows down and barely moves."}, {"w": "see the light", "a": "finally understand something", "wm": "finally understand something", "am": "", "s": "After the third example, I finally {saw the light} and solved the sum.", "t": "pv", "tag": "understand", "book": "understand", "lit": "Picture sitting in a dark room when someone switches on a lamp. Suddenly you can see everything clearly!"}, {"w": "read between the lines", "a": "find a hidden meaning", "wm": "find a hidden meaning", "am": "", "s": "If you {read between the lines}, you can tell Mum isn't happy about the mess.", "t": "pv", "tag": "hidden meaning", "book": "find the hidden meaning", "lit": "Imagine a secret message hidden in the gaps between the lines of a letter, written in invisible ink!"}, {"w": "no laughing matter", "a": "something serious", "wm": "something serious", "am": "", "s": "Playing near the busy road is {no laughing matter}.", "t": "pv", "tag": "serious", "book": "serious matter", "lit": "Some things are funny, but some are far too serious to joke about."}, {"w": "go back on your word", "a": "not do what you promised", "wm": "not do what you promised", "am": "", "s": "Dad never {goes back on his word}; if he promises ice cream, we get it.", "t": "pv", "tag": "break promise", "book": "break a promise", "lit": "Your word is your promise. Going back on it is like turning around halfway across a bridge you said you would cross."}, {"w": "in the long run", "a": "in the end, after a long time", "wm": "in the end, after a long time", "am": "", "s": "Practising every day is hard, but {in the long run} you'll play much better.", "t": "pv", "tag": "eventually", "book": "eventually", "lit": "Picture a long race. You may be behind at first, but what matters is where you are at the finish."}, {"w": "laugh up your sleeve", "a": "laugh secretly at someone", "wm": "laugh secretly at someone", "am": "", "s": "While Ah Seng searched for his hidden pencil case, his friends were {laughing up their sleeves}.", "t": "pv", "tag": "secret laugh", "book": "laugh secretly at somebody", "lit": "Long ago, people wore clothes with wide, loose sleeves. They could hide their faces behind them to laugh in secret."}, {"w": "sit on the fence", "a": "not take sides in an argument", "wm": "not take sides in an argument", "am": "", "s": "When my friends argued about which team was best, I {sat on the fence}.", "t": "pv", "tag": "undecided", "book": "not taking sides in any disagreement", "lit": "Picture sitting on top of a fence between two gardens. You aren't in either one!"}, {"w": "mind one's p's and q's", "a": "be careful to behave politely", "wm": "be careful to behave politely", "am": "", "s": "We must {mind our p's and q's} when we visit the principal's office.", "t": "pv", "tag": "polite", "book": "be careful of one's behaviour", "lit": "Nobody knows for sure. One idea is that children learning to write had to be careful not to mix up the letters p and q!"}, {"w": "turn tail", "a": "turn and run away", "wm": "turn and run away", "am": "", "s": "The cat hissed, and the big dog {turned tail} and fled.", "t": "pv", "tag": "run away", "book": "run away", "lit": "Picture an animal spinning around so its tail faces the enemy as it runs off."}, {"w": "bad egg", "a": "a person who often does bad things", "wm": "a person who often does bad things", "am": "", "s": "Don't make friends with him; he's {a bad egg}.", "t": "pv", "tag": "worthless person", "book": "worthless person", "lit": "Picture an egg that looks fine on the outside, but when you crack it open, pooh, it's rotten!"}, {"w": "build castles in the air", "a": "dream of things that will never happen", "wm": "dream of things that will never happen", "am": "", "s": "Instead of studying, Jun sat {building castles in the air} about becoming a pop star.", "t": "pv", "tag": "daydream", "book": "daydream", "lit": "Picture a beautiful castle floating in the sky. It looks wonderful, but it has nothing to stand on!"}, {"w": "in the same boat", "a": "in the same difficult situation", "wm": "in the same difficult situation", "am": "", "s": "Don't worry about the hard homework; we're all {in the same boat}.", "t": "pv", "tag": "same situation", "book": "under the same circumstances", "lit": "Picture everyone in one little boat on a stormy sea. Whatever happens, it happens to all of you."}, {"w": "paddle your own canoe", "a": "do things by yourself without help", "wm": "do things by yourself without help", "am": "", "s": "Now that she's older, my sister wants to {paddle her own canoe}.", "t": "pv", "tag": "independent", "book": "do things by yourself", "lit": "Picture paddling a canoe on your own. Nobody else is steering or rowing for you."}, {"w": "bread and butter", "a": "the way someone earns a living", "wm": "the way someone earns a living", "am": "", "s": "Selling fish at the market is Mr Ong's {bread and butter}.", "t": "pv", "tag": "living", "book": "livelihood", "lit": "Bread and butter are simple, everyday foods. A job that pays for your daily food is your bread and butter."}, {"w": "carry on", "a": "keep doing something", "wm": "keep doing something", "am": "", "s": "{Carry on} with your work while I answer the phone.", "t": "pv", "tag": "continue", "book": "continue", "lit": "Picture carrying a heavy bag and keeping on walking, instead of putting it down.", "note": "'Carry on' is also a phrasal verb. You will meet it again in the phrasal verbs chapter."}, {"w": "carry weight", "a": "be important and listened to", "wm": "be important and listened to", "am": "", "s": "The principal's opinion {carries weight} with all the teachers.", "t": "pv", "tag": "important", "book": "be important", "lit": "Picture a heavy weight on a scale. It tips the balance, just as an important opinion can tip a decision."}, {"w": "out of date", "a": "old-fashioned; no longer used", "wm": "old-fashioned; no longer used", "am": "", "s": "This map is {out of date}; it doesn't show the new MRT line.", "t": "pv", "tag": "old-fashioned", "book": "old-fashioned", "lit": "Picture a calendar from many years ago. Its dates have passed, so it's no longer useful."}, {"w": "up to date", "a": "modern, with the newest information", "wm": "modern, with the newest information", "am": "", "s": "Our school bought new computers, so they are fully {up to date}.", "t": "pv", "tag": "modern", "book": "modern", "lit": "Picture a calendar turned to today's page. Everything on it is current."}, {"w": "win the day", "a": "win in the end", "wm": "win in the end", "am": "", "s": "It was a close match, but our team {won the day}.", "t": "pv", "tag": "win", "book": "be victorious", "lit": "Long ago, many battles lasted a single day. The army still standing at sunset had won the day."}, {"w": "make a day of it", "a": "spend a whole day enjoying something", "wm": "spend a whole day enjoying something", "am": "", "s": "Since we're going to Sentosa, let's {make a day of it} and stay till the fireworks.", "t": "pv", "tag": "whole day", "book": "spend the whole day", "lit": "Picture a short outing that's so much fun you stretch it out from morning till night."}, {"w": "pick and choose", "a": "choose very carefully", "wm": "choose very carefully", "am": "", "s": "With so many stalls at the hawker centre, we can {pick and choose}.", "t": "pv", "tag": "choose carefully", "book": "choose very carefully", "lit": "Picture picking up fruit at the market one by one, choosing only the very best."}, {"w": "dead broke", "a": "have no money at all", "wm": "have no money at all", "am": "", "s": "I spent all my pocket money on stickers, and now I'm {dead broke}.", "t": "pv", "tag": "money", "book": "without a cent to spend", "lit": "'Broke' means having no money, like a broken piggy bank with nothing inside. 'Dead' makes it even stronger: totally broke!"}, {"w": "make both ends meet", "a": "have just enough money for what you need", "wm": "have just enough money for what you need", "am": "", "s": "Mr Raj works two jobs to {make both ends meet}.", "t": "pv", "tag": "money", "book": "spend within one's income", "lit": "Picture the money coming in and the money going out as two ends of a string. If they meet, you don't run short.", "note": "Today people usually say 'make ends meet'."}, {"w": "a die-hard", "a": "someone who won't give up their ideas", "wm": "someone who won't give up their ideas", "am": "", "s": "Grandpa is {a die-hard} football fan who never misses a match.", "t": "pv", "tag": "stubborn", "book": "one who does not give up his ideas easily", "lit": "Picture someone who keeps fighting to the very end and refuses to give in, even when things look hopeless."}, {"w": "a dare-devil", "a": "a person who loves doing dangerous things", "wm": "a person who loves doing dangerous things", "am": "", "s": "My cousin is {a dare-devil}; he rode the tallest roller coaster ten times.", "t": "pv", "tag": "reckless", "book": "recklessly daring person", "lit": "Picture someone so bold they would dare even the devil to a challenge!", "note": "Usually written as one word: 'daredevil'."}, {"w": "Dutch courage", "a": "courage that comes from drinking alcohol", "wm": "courage that comes from drinking alcohol", "am": "", "s": "In the story, the nervous sailor drank some rum for {Dutch courage} before the storm.", "t": "pv", "tag": "drink courage", "book": "false courage obtained by drinking alcohol", "lit": "Long ago, English soldiers were said to drink Dutch gin before battle to feel braver.", "note": "An older expression that mentions a nationality. It is good to understand it, but today people may find it unkind to the Dutch."}, {"w": "French leave", "a": "be away without permission", "wm": "be away without permission", "am": "", "s": "The soldier took {French leave} and slipped away from the camp at night.", "t": "pv", "tag": "absent", "book": "absence without permission", "lit": "In the 1700s, it was said to be a French custom to leave a party without saying goodbye to the host.", "note": "An older expression that mentions a nationality. Today people usually just say 'leave without permission'."}, {"w": "happy-go-lucky", "a": "cheerful and not worried about anything", "wm": "cheerful and not worried about anything", "am": "", "s": "Uncle Sam is so {happy-go-lucky} that nothing seems to upset him.", "t": "pv", "tag": "carefree", "book": "taking events cheerfully", "lit": "Picture someone skipping along happily, trusting that luck will take care of whatever comes."}, {"w": "good-for-nothing", "a": "a lazy and useless person", "wm": "a lazy and useless person", "am": "", "s": "In the fairy tale, the miller's {good-for-nothing} son slept all day.", "t": "pv", "tag": "worthless person", "book": "useless person", "lit": "Just as it sounds: a person who is good for nothing at all!"}, {"w": "hit upon", "a": "suddenly think of or find something", "wm": "suddenly think of or find something", "am": "", "s": "While playing with Lego, Siew Ling {hit upon} a great idea for her science project.", "t": "pv", "tag": "discover", "book": "discover", "lit": "Picture walking along and bumping into treasure by chance. You've hit upon it!"}, {"w": "fall upon", "a": "attack suddenly", "wm": "attack suddenly", "am": "", "s": "The soldiers {fell upon} the enemy camp at dawn.", "t": "pv", "tag": "fight", "book": "attack", "lit": "Picture an eagle swooping down from the sky and landing on its prey all at once."}, {"w": "ups and downs", "a": "good times and bad times", "wm": "good times and bad times", "am": "", "s": "Every friendship has its {ups and downs}.", "t": "pv", "tag": "good and bad times", "book": "good times and bad times", "lit": "Picture a roller coaster climbing high and then zooming down, again and again."}, {"w": "on thin ice", "a": "in a risky situation that may cause trouble", "wm": "in a risky situation that may cause trouble", "am": "", "s": "After forgetting his homework three times, Wei Ming is {on thin ice} with his teacher.", "t": "pv", "tag": "risky situation", "book": "in a dangerous and difficult position", "lit": "Picture walking on a frozen pond where the ice is thin. One wrong step and... crack!"}, {"w": "break the ice", "a": "make people feel relaxed when they first meet", "wm": "make people feel relaxed when they first meet", "am": "", "s": "Our teacher played a fun game to {break the ice} on the first day of school.", "t": "pv", "tag": "start talking", "book": "be the first to start", "lit": "Long ago, special ships broke up frozen ice so other ships could sail through. Breaking the ice gets things moving."}, {"w": "eleventh hour", "a": "at the very last moment", "wm": "at the very last moment", "am": "", "s": "She finally finished her project at {the eleventh hour}.", "t": "pv", "tag": "last minute", "book": "last minute", "lit": "In a Bible story, workers hired at the eleventh hour of a twelve-hour working day were only just in time to be paid."}, {"w": "in the nick of time", "a": "only just in time", "wm": "only just in time", "am": "", "s": "We reached the bus stop {in the nick of time}.", "t": "pv", "tag": "last minute", "book": "only just in time", "lit": "A nick is a tiny notch cut into something. Picture a notch marking the exact moment; you arrive right on it!"}, {"w": "play second fiddle", "a": "have a less important role than someone", "wm": "have a less important role than someone", "am": "", "s": "Tired of {playing second fiddle} to her sister, Amy started her own band.", "t": "pv", "tag": "less important", "book": "be unimportant", "lit": "In an orchestra, the first violin (fiddle) plays the main tune. The second fiddle plays a less important part."}, {"w": "hard and fast rule", "a": "a very strict rule that can't change", "wm": "a very strict rule that can't change", "am": "", "s": "There's no {hard and fast rule} about what to wear to the party.", "t": "pv", "tag": "strict rule", "book": "very strict rule", "lit": "A ship stuck firmly on the shore was called 'hard and fast'. It couldn't move, and neither can a strict rule!"}, {"w": "drawn the line somewhere", "a": "set a limit on what you will accept", "wm": "set a limit on what you will accept", "am": "", "s": "Mum lets us play games, but she has to {draw the line somewhere}, so it's one hour a day.", "t": "pv", "tag": "limit", "book": "have a limit", "lit": "Picture drawing a line on the ground and saying, 'You may go this far, but not one step more!'", "note": "Usually said 'draw the line', as in 'I draw the line at...' or 'You have to draw the line somewhere.'"}, {"w": "up to the mark", "a": "good enough; meeting the standard", "wm": "good enough; meeting the standard", "am": "", "s": "Your work isn't {up to the mark}, so please do it again.", "t": "pv", "tag": "good enough", "book": "up to a certain standard", "lit": "Picture a line marked on a wall. You have to reach up to that mark to pass."}, {"w": "march in Indian file", "a": "walk one behind another in a line", "wm": "walk one behind another in a line", "am": "", "s": "The children {marched in Indian file} along the narrow jungle path.", "t": "pv", "tag": "single file", "book": "march single file", "lit": "Long ago, European settlers in America saw some Native American groups walking one behind another along narrow trails.", "note": "An older expression that mentions a group of people. Today people usually say 'single file'."}, {"w": "far from it", "a": "not at all; the very opposite", "wm": "not at all; the very opposite", "am": "", "s": "Was the test easy? {Far from it}; it was the hardest one yet!", "t": "pv", "tag": "not at all", "book": "unlikely", "lit": "Picture the truth being a long, long way from what was said.", "note": "The book says 'unlikely', but today this phrase is used to mean 'not at all' or 'the opposite is true'."}, {"w": "caught napping", "a": "caught by surprise and not ready", "wm": "caught by surprise and not ready", "am": "", "s": "The goalkeeper was {caught napping} when the ball flew past him.", "t": "pv", "tag": "unprepared", "book": "taken by surprise", "lit": "Picture a guard dozing off just as someone sneaks past!"}, {"w": "child's play", "a": "something very easy to do", "wm": "something very easy to do", "am": "", "s": "For a computer expert like Uncle Ben, fixing my laptop was {child's play}.", "t": "pv", "tag": "easy", "book": "very easy task", "lit": "Picture a game so simple that even a little child can do it."}, {"w": "lady's man", "a": "a man who likes spending time with women", "wm": "a man who likes spending time with women", "am": "", "s": "In the old film, the hero was {a lady's man} who charmed everyone at the parties.", "t": "pv", "tag": "ladies", "book": "man who is fond of female company", "lit": "Picture a man who is always surrounded by ladies, chatting and being charming.", "note": "Also written 'ladies' man'."}, {"w": "man of straw", "a": "a weak person of no real importance", "wm": "a weak person of no real importance", "am": "", "s": "The king in the story was {a man of straw}; his advisers made all the decisions.", "t": "pv", "tag": "worthless person", "book": "weak and worthless person", "lit": "A scarecrow is a man made of straw. It looks like a person, but it has no strength at all."}, {"w": "out of the question", "a": "not possible or not allowed", "wm": "not possible or not allowed", "am": "", "s": "Going to the beach in this storm is {out of the qu <script>
(function(){
const ALL = ENTRIES.map((x,i)=>({i,key:x.w+"|"+x.a,word:x.w,syn:x.a,meaning:x.wm,am:x.am,sentence:x.s,note:x.note,type:x.t,g:x.g,fakes:x.fakes||[],bf:new Set(x.bf||[]),br:new Set(x.br||[]),skip:!!x.skip,grp:x.grp||null,sp:x.sp||"",tag:x.tag||"",book:x.book||"",lit:x.lit||"",adj:x.adj||"",nouns:x.nouns||null,noun:x.noun||"",front:x.front||""}));
const W = ALL.filter(e=>!e.skip);
const alts = a=>a.split("/").map(s=>s.trim());
const show = a=>a.replace(/\//g," / ");
const GL={};ALL.forEach(e=>{GL[e.word.toLowerCase()]=GL[e.word.toLowerCase()]||e.meaning;alts(e.syn).forEach(s=>{GL[s.toLowerCase()]=GL[s.toLowerCase()]||e.am})});
const PAIRTERMS=[...new Set(W.filter(e=>e.type==="pair").flatMap(e=>[e.word,...alts(e.syn)]))];
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);
const gloss=w=>GL[String(w).toLowerCase()]||"";




/* learner state: which words have been asked, and which are tricky */
const LKEY=CHAPTER.key+"-learner", ROUND=10, MIX_AT=10, MIX_TRICKY=3, GRADUATE=2;
let L={seen:{},tricky:[],updatedAt:0};
try{const s=JSON.parse(localStorage.getItem(LKEY)||"null");if(s&&s.seen)L=s;else{const old=JSON.parse(localStorage.getItem(CHAPTER.key+"-tricky")||"[]");L.tricky=old}}catch(e){}
let tricky=new Set(L.tricky);
let learnerDirty=false;
const saveL=()=>{L.tricky=[...tricky];L.updatedAt=Date.now();learnerDirty=true;try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){}scheduleSave()};
const saveTricky=saveL;
const unseen=()=>W.filter(e=>!L.seen[e.key]);
const lastAsked=e=>(L.seen[e.key]&&L.seen[e.key].last)||0;
function record(word,ok){
  const s=L.seen[word]||(L.seen[word]={n:0,ok:0,streak:0,last:0});
  s.n++;s.last=Date.now();let graduated=false;
  if(ok){s.ok++;s.streak++;if(tricky.has(word)&&s.streak>=GRADUATE){tricky.delete(word);graduated=true}}
