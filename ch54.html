<script>
const CHAPTER = {

// [word, synonym, simple meaning, example sentence ({} marks the word), optional tip]
const RAW = [
["abandon","leave","to go away from someone or something and never come back","The crew had to {abandon} the sinking ship."],
["abide","dwell","to live or stay in a place (an old-fashioned word)","The hermit chose to {abide} in a cave in the hills.","‘Abide’ can also mean ‘put up with’, as in ‘I can’t abide loud music.’"],
["abbreviate","shorten","to make a word or phrase shorter","We often {abbreviate} ‘Singapore’ to ‘SG’."],
["abduct","kidnap","to take a person away by force","In the story, pirates tried to {abduct} the prince."],
["abrupt","sudden","happening very quickly, without any warning","The bus came to an {abrupt} stop and we all lurched forward."],
["abstain","refrain","to choose not to do something","During the fast, they {abstain} from eating until sunset."],
["abundant","plentiful","more than enough; a lot of it","Rain is {abundant} in Singapore during the monsoon season."],
["accommodation","lodging","a place to stay or sleep","We booked {accommodation} near the beach for the holiday."],
["accuse","blame","to say that someone did something wrong","Don’t {accuse} your brother without proof."],
["acute","sharp","very strong or sharp, like a sudden pain","He felt an {acute} pain in his tooth."],
["adhere","stick","to stick firmly to something","This tape will {adhere} to any smooth surface."],
["adore","worship","to love someone or something very, very much","My little sister {adores} her teddy bear."],
["aid","help","help or support given to someone","The Red Cross sent {aid} to the flood victims."],
["ally","friend","a person or country that is on your side","Britain was an {ally} of France during the war."],
["altitude","height","how high something is above the ground or the sea","The plane flew at an {altitude} of 10,000 metres."],
["ample","plentiful","enough, or more than enough","There is {ample} time to finish the test, so don’t rush."],
["ancient","old","very, very old; from long ago","We saw {ancient} Egyptian mummies at the museum."],
["annually","yearly","once every year","Sports Day is held {annually} in our school."],
["anticipate","expect","to think that something will happen","We {anticipate} heavy traffic on the way to the airport."],
["assemble","gather","to come together in one place","The pupils {assemble} in the hall every morning."],
["assist","help","to help someone do something","Can you {assist} me in carrying these books?"],
["astonishment","surprise","a feeling of very great surprise","To our {astonishment}, the magician pulled a rabbit out of the hat."],
["attire","dress","clothes, especially for a special event","Formal {attire} is required for the dinner.","Here ‘dress’ means clothing in general, not only a girl’s dress."],
["austere","severe","very plain and strict, with no comfort or fun","The old headmaster had an {austere} face that never smiled."],
["beautify","decorate","to make something look prettier","We planted flowers to {beautify} the school garden."],
["besieged","surrounded","surrounded by an enemy army (or by a crowd)","The castle was {besieged} by the enemy for months."],
["beverage","drink","any kind of drink","Coffee and tea are popular {beverages}."],
["beg","implore","to ask for something very strongly, almost desperately","The puppy seemed to {beg} for a piece of my sandwich."],
["behaviour","conduct","the way a person acts","Her good {behaviour} earned her a prize."],
["big","large","of great size","An elephant is a {big} animal."],
["blame","reprove","to say that someone is at fault, or to tell them off","Mum will {blame} me if the vase breaks."],
["blank","empty","with nothing written or drawn on it","Write your name on the {blank} line at the top."],
["bottom","foot","the lowest part of something","We waited at the {bottom} of the hill.","Here ‘foot’ means the lowest part, as in ‘the foot of the hill’."],
["brief","short","lasting only a short time, or using few words","The principal gave a {brief} speech."],
["bright","shining","giving out a lot of light","The {bright} sun made me squint."],
["broad","wide","large from one side to the other","The river is very {broad} near the sea."],
["busy","industrious","working hard and having lots to do","Ants are {busy} insects that work all day."],
["calm","quiet","peaceful, without noise or worry","The sea was {calm} after the storm."],
["catch","capture","to take hold of something that is moving or running away","The police managed to {catch} the thief."],
["cause","reason","the thing that makes something happen","Heavy rain was the {cause} of the flood."],
["cautious","careful","careful to avoid danger","Be {cautious} when crossing the road."],
["cease","stop","to stop","The noise did not {cease} until midnight."],
["celebrated","famous","known and admired by many people","He is a {celebrated} writer of children’s books."],
["centre","middle","the middle point of something","There is a fountain in the {centre} of the park."],
["chivalrous","gallant","polite, brave and kind to others, like a good knight","The {chivalrous} boy gave up his seat to an old lady."],
["choose","select","to pick one from several things","You may {choose} any book from the shelf."],
["circular","round","shaped like a circle","We sat at a {circular} table."],
["clergyman","minister","a priest or church leader","The {clergyman} led the church service."],
["close","near","not far away","Our school is {close} to the MRT station."],
["clothes","dress","the things you wear","Pack enough {clothes} for the trip."],
["coarse","rough","not smooth; rough to touch","The sand was {coarse} and hurt my feet."],
["colossal","huge","extremely big","A {colossal} statue stood at the harbour entrance."],
["commence","begin","to begin or start (a formal word)","The exam will {commence} at 9 a.m."],
["compel","force","to make someone do something they don’t want to do","The heavy rain {compelled} us to stay indoors."],
["comprehend","understand","to understand","I could not {comprehend} the difficult question."],
["conceal","hide","to hide something so it cannot be seen","The cat tried to {conceal} itself under the bed."],

["confess","admit","to say that you did something wrong","Tom decided to {confess} that he broke the window."],
["constable","policeman","a police officer of the lowest rank","A {constable} helped us find our way."],
["converse","talk","to talk with someone","The two friends {conversed} quietly in the library."],
["courageous","brave","not afraid to face danger","The {courageous} firefighter ran into the burning house."],
["courteous","polite","polite and respectful","The shop assistant was very {courteous} to customers."],
["cross","ill-tempered","angry or annoyed","Dad was {cross} because we were late.","Here ‘cross’ means angry, not the ✕ shape."],
["cunning","sly","clever at tricking people","The {cunning} fox tricked the crow into dropping its cheese."],
["curb","control","to hold something back and keep it under control","You must learn to {curb} your temper."],
["dangerous","risky","likely to cause harm","It is {dangerous} to swim during a thunderstorm."],
["daring","brave","brave enough to do risky things","The {daring} climber reached the top of the cliff."],
["dear","expensive","costing a lot of money","Durians are very {dear} this season.","‘Dear’ can also mean loved, as in ‘Dear Grandma’."],
["deceive","cheat","to make someone believe something that is not true","The salesman tried to {deceive} us with fake watches."],
["decrease","reduce","to become or make smaller","Please {decrease} the volume of the TV."],
["deficiency","shortage","not having enough of something","A {deficiency} of vitamin C can make you ill."],
["demonstrate","show","to show how something works","The teacher will {demonstrate} how to use the microscope."],
["deride","mock","to laugh at someone in an unkind way","It is wrong to {deride} someone for making a mistake."],
["desert","forsake","to leave someone who needs you","A true friend will never {desert} you.","Say it de-ZERT. A desert (DEZ-ert) is a dry, sandy place."],
["despise","scorn","to dislike someone and look down on them","She {despises} people who are cruel to animals."],
["detest","hate","to hate very much","I {detest} the smell of rotten eggs."],
["difficult","hard","not easy","The last maths problem was very {difficult}."],
["diminish","lessen","to become smaller or weaker","The pain began to {diminish} after I took the medicine."],
["disaster","calamity","a terrible event that causes great damage","The earthquake was a terrible {disaster}."],
["disease","sickness","an illness","Dengue is a {disease} spread by mosquitoes."],
["disorder","chaos","a state of mess and confusion","After the party, the room was in complete {disorder}."],
["disperse","scatter","to spread out in different directions","The crowd began to {disperse} after the show."],
["drowsy","sleepy","feeling sleepy","The warm afternoon made me feel {drowsy}."],
["dubious","doubtful","not sure if something is true or good","I am {dubious} about his story; it sounds made up."],
["dull","gloomy","dark, not bright or cheerful","It was a {dull}, rainy day.","‘Dull’ can also mean boring."],
["eager","keen","really wanting to do something","The pupils were {eager} to go on the field trip."],
["ebb","recede","to move back or go away, like the sea going out","We collected shells when the tide began to {ebb}."],
["edible","eatable","safe to eat","Some mushrooms are {edible}, but others are poisonous."],
["educate","teach","to teach someone","Schools {educate} children."],
["elevate","raise","to lift something higher","{Elevate} your injured leg on a pillow."],
["elude","escape","to escape from someone by being clever or quick","The mouse managed to {elude} the cat."],
["embrace","hug","to hold someone tightly in your arms","Grandma {embraced} me when I arrived."],
["eminent","famous","famous and respected, especially in their work","An {eminent} scientist visited our school."],
["encircle","surround","to make a circle all around something","A fence {encircles} the playground."],
["endeavour","attempt","to try hard","I will {endeavour} to finish my homework before dinner."],
["enemy","foe","someone who is against you","In the story, the dragon was the knight’s {enemy}."],
["energetic","active","full of energy","Puppies are very {energetic} and love to play."],
["enormous","gigantic","extremely big","The blue whale is an {enormous} animal."],
["enough","sufficient","as much as you need","Do we have {enough} chairs for everyone?"],
["entice","lure","to tempt someone to come or do something, often with something nice","The smell of fresh bread {enticed} us into the bakery."],
["entire","whole","all of something","She ate the {entire} cake by herself!"],
["eternal","everlasting","lasting forever","The story is about a search for {eternal} life."],
["exaggerate","magnify","to make something sound bigger or better than it really is","Don’t {exaggerate}! The fish wasn’t that big."],
["excess","surplus","more than what is needed","We gave the {excess} food to a charity."],
["exhibit","show","to put something where people can see it","The museum will {exhibit} dinosaur bones."],
["exterior","outside","the outside part of something","The {exterior} of the house was painted blue."],
["face","countenance","the face, or the look on someone’s face","Her {face} lit up when she saw the present."],
["fall","drop","to go down suddenly","Be careful not to {fall} off the ladder."],
["far","distant","a long way away","The stars are very {far} from Earth."],
["fashion","style","a popular way of dressing or doing things","Long skirts are back in {fashion}."],
["fasten","bind","to tie or fix firmly","Please {fasten} your seat belt."],
["fatal","deadly","causing death","The snake’s bite can be {fatal}."],
["fate","destiny","what will happen to someone in the future, as if already decided","It was {fate} that brought the two old friends together again."],
["fatigue","weariness","great tiredness","After the marathon, the runners felt great {fatigue}."],
["fault","error","a mistake, or something wrong","There is a {fault} in the machine, so it keeps stopping."],
["fear","terror","the feeling of being afraid","The kitten shook with {fear} during the thunderstorm."],
["fearful","cowardly","easily frightened; scared","The {fearful} boy hid behind his mother."],
["feeble","weak","very weak","The sick old dog was too {feeble} to stand."],
["ferocious","fierce","very fierce and violent","The {ferocious} tiger roared loudly."],
["fertile","fruitful","able to grow lots of crops or fruit","The {fertile} soil grew big, healthy vegetables."],
["fight","battle","a fight between people or armies","The two armies prepared for a {fight}."],
["float","drift","to move slowly on water or in the air","The leaves {floated} down the stream."],
["fond","loving","liking someone or something a lot","She is very {fond} of her grandfather."],
["frank","outspoken","honest, saying exactly what you think","To be {frank}, I didn’t enjoy the movie."],
["free","release","to let someone or something go","The boy {freed} the bird from its cage."],
["friend","comrade","a friend, especially one who shares hard times with you","The soldier helped his wounded {friend}."],
["friendly","amiable","kind and pleasant","Our new neighbour is very {friendly}."],
["frigid","cold","very cold","The {frigid} Arctic wind froze everything."],
["gain","profit","something good that you get or earn","There is no {gain} without hard work."],

"wide-spread":"found in many places",revolt:"a fight against those in power",putrid:"rotten and smelly",red:"the colour of blood",impolite:"rude",govern:"to rule a country",main:"most important",greet:"to say hello to someone",few:"not many",despise:"to look down on and hate",rarely:"not often",separate:"to divide or cut apart",importance:"how much something matters",offence:"a wrong act",smooth:"even, with no bumps",slim:"thin",little:"small",scent:"a smell, usually a nice one",memento:"something kept to help you remember",ghost:"the spirit of a dead person",waste:"to use carelessly",purloin:"to steal",horse:"a large animal people ride",strict:"making people follow the rules",enough:"as much as needed",appropriate:"suitable; right for the situation",top:"the highest point",yield:"to give in",hung:"hanging from something",stormy:"with strong winds and rain",fear:"the feeling of being scared",tried:"tested to see if it is good",burglar:"a thief who breaks into buildings",push:"to press against something to move it",calm:"peaceful and still",clear:"easy to see through",hoax:"a trick to make people believe something false",believe:"to think something is true",modest:"not boasting about yourself",generally:"usually; in most cases",bravery:"being brave",worth:"value",speed:"how fast something moves",anger:"a strong feeling of being upset and cross",triumph:"a great win",puny:"small and weak",rich:"having lots of money",retire:"to go away or move back",amazement:"great surprise",ring:"a circle shape",miserable:"very unhappy",desire:"a strong wish for something",surrender:"to give up",young:"not old",keenness:"eagerness",relish:"great enjoyment"

<script>
(function(){
const W = RAW.map(([word,syn,meaning,sentence,note],i)=>({i,word,syn,meaning,sentence,note}));
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);
const gloss=w=>(typeof GLOSS!=="undefined"&&GLOSS[w])||"";


/* group words that mean the same so a question never has two right answers */
const P={};const f=x=>{x=x.toLowerCase();if(!(x in P))P[x]=x;while(P[x]!==x){P[x]=P[P[x]];x=P[x]}return x};
const u=(a,b)=>{P[f(a)]=f(b)};
W.forEach(e=>u(e.word,e.syn)); (typeof CLUSTERS!=="undefined"?CLUSTERS:[]).forEach(g=>g.forEach(x=>u(g[0],x)));
const same=(a,b)=>f(a)===f(b);

/* ---------- hosted mode: Supabase storage when not inside Claude ---------- */
const SUPA={url:"https://yezqrwjtwwhnuawmjeod.supabase.co",key:"sb_publishable_HTl05cHUNd1LJ_-ai8GaAw_oXjk-NCT"};
const HOSTED=!(window.claude&&window.claude.use);
let LEARNER="";try{LEARNER=localStorage.getItem("vocab-learner")||""}catch(e){}
const cleanName=s=>String(s||"").trim().replace(/[^A-Za-z0-9 _-]/g,"").slice(0,30);
function supaDB(learner){
  const H={"apikey":SUPA.key,"Content-Type":"application/json"};
  const base=SUPA.url+"/rest/v1/vocab_progress";
  const q=(kind,key)=>`?learner=eq.${encodeURIComponent(learner)}&chapter=eq.${CHAPTER.num}&kind=eq.${kind}`+(key!=null?`&key=eq.${encodeURIComponent(key)}`:"");
  const fail=async r=>{let m="";try{m=(await r.json()).message||""}catch(e){}return {code:"error "+r.status,message:m}};
  return {
    doc(p){const i=p.indexOf("/"),kind=p.slice(0,i),key=p.slice(i+1);return {
      async set(data){const r=await fetch(base+"?on_conflict=learner,chapter,kind,key",{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({learner,chapter:CHAPTER.num,kind,key,data,updated_at:new Date().toISOString()})});if(!r.ok)throw await fail(r)},
      async get(){const r=await fetch(base+q(kind,key)+"&select=data",{headers:H});if(!r.ok)throw await fail(r);const j=await r.json();return {exists:j.length>0,data:()=>j[0]&&j[0].data}}
    }},
    collection(kind){return {onSnapshot(next,err){
      const load=async()=>{try{const r=await fetch(base+q(kind)+"&select=data",{headers:H});if(!r.ok)throw await fail(r);const j=await r.json();next({docs:j.map(x=>({data:()=>x.data})),metadata:{fromCache:false}})}catch(e){err&&err(e)}};
      load();const iv=setInterval(load,60000);return ()=>clearInterval(iv)}}}
  };
}
function namePrompt(){
  $("#bar").hidden=true;$("#status").hidden=true;
  $("#stage").innerHTML=`<p class="ask">Who is practising?</p>
    <p>Type your name once. Your progress is saved online under this name, so you can carry on from any device.</p>
    <form id="nameForm" class="row"><input id="nameIn" type="text" autocomplete="off" maxlength="30" placeholder="Your name" style="flex:1 1 200px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:18px"><button class="btn" type="submit">Start</button></form>
    <p class="hint">Use the same name every time, on every device.</p>`;
  $("#nameForm").onsubmit=ev=>{ev.preventDefault();const n=cleanName($("#nameIn").value);if(!n)return;try{localStorage.setItem("vocab-learner",n)}catch(e){}location.reload()};
  $("#nameIn").focus();
}
/* learner state: which words have been asked, and which are tricky */
const LKEY=CHAPTER.key+"-learner"+(HOSTED&&LEARNER?"-"+LEARNER.toLowerCase():""), ROUND=10, MIX_AT=10, MIX_TRICKY=3, GRADUATE=2;
let L={seen:{},tricky:[],updatedAt:0};
try{const s=JSON.parse(localStorage.getItem(LKEY)||"null");if(s&&s.seen)L=s;else{const old=JSON.parse(localStorage.getItem(CHAPTER.key+"-tricky")||"[]");L.tricky=old}}catch(e){}
let tricky=new Set(L.tricky);
let learnerDirty=false;
const loadL=()=>{try{const s=JSON.parse(localStorage.getItem(LKEY)||"null");if(s&&s.seen){L=s;tricky=new Set(L.tricky||[])}}catch(e){}};
const saveL=()=>{L.tricky=[...tricky];L.updatedAt=Date.now();learnerDirty=true;try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){}scheduleSave()};
const saveTricky=saveL;
const unseen=()=>W.filter(e=>!L.seen[e.word]);
const lastAsked=e=>(L.seen[e.word]&&L.seen[e.word].last)||0;
function record(word,ok){
  loadL();const s=L.seen[word]||(L.seen[word]={n:0,ok:0,streak:0,last:0});
  s.n++;s.last=Date.now();let graduated=false;
  if(ok){s.ok++;s.streak++;if(tricky.has(word)&&s.streak>=GRADUATE){tricky.delete(word);graduated=true}}
  else{s.streak=0;tricky.add(word)}
  saveL();return graduated;
}
/* a round: 10 new words; once there are more than 10 tricky words, 3 tricky + 7 new.
   When new words run out, fill with tricky words, then with the words seen longest ago. */
function buildRound(){
  const trk=W.filter(e=>tricky.has(e.word)).sort((a,b)=>lastAsked(a)-lastAsked(b));
  const fresh=shuffle(unseen());
  const pick=[];const add=list=>{for(const e of list){if(pick.length>=ROUND)break;if(!pick.includes(e))pick.push(e)}};
  if(tricky.size>MIX_AT)add(trk.slice(0,MIX_TRICKY));
  add(fresh);add(trk);
  add(W.filter(e=>L.seen[e.word]&&!tricky.has(e.word)).sort((a,b)=>lastAsked(a)-lastAsked(b)));
  const nNew=pick.filter(e=>!L.seen[e.word]).length,nTricky=pick.filter(e=>tricky.has(e.word)).length;
  return {items:shuffle(pick),mix:{nNew,nTricky,nReview:pick.length-nNew-nTricky}};
}

let mode="quiz", setSel="round";
try{const m=localStorage.getItem(CHAPTER.key+"-mode");if(m)mode=m}catch(e){}

function fillSets(){
  const sel=$("#set");const quizish=mode==="quiz"||mode==="reverse";
  const opts=quizish?[["round","Next round (10 questions)"],["tricky",`Only my tricky words (${tricky.size})`]]
                    :[["all",`All ${W.length} words`],["tricky",`My tricky words (${tricky.size})`]];
  sel.innerHTML=opts.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("");
  if(!opts.some(o=>o[0]===setSel))setSel=opts[0][0];
  sel.value=setSel;
  const left=unseen().length;
  $("#status").innerHTML=`New words left: <b>${left}</b> of ${W.length} · Tricky words: <b>${tricky.size}</b>`+(left===0?" · All words seen! Rounds are now review.":"");
}
function pool(){
  if(setSel==="tricky")return W.filter(e=>tricky.has(e.word));
  return W;
}

const speakIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function sayBtn(t){return `<button class="say" data-say="${esc(t)}" aria-label="Hear ${esc(t)}">${speakIcon}</button>`}
function say(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const v=new SpeechSynthesisUtterance(t);v.lang="en-GB";v.rate=.9;s.speak(v)}catch(e){}}
function sentenceHTML(e,swap){
  return esc(e.sentence).replace(/\{([^}]+)\}/,(_,w)=>`<span class="target">${w}</span>`+(swap?` <span style="color:var(--blue)">(= ${esc(e.syn)})</span>`:""));
}
function tipHTML(e){return e.note?`<p class="tip"><b>Tip:</b> ${esc(e.note)}</p>`:""}

/* ---------- quiz (forward + reverse) ---------- */
let Q=null;
function startQuiz(){
  let items,mix=null;
  if(setSel==="tricky"){const t=W.filter(e=>tricky.has(e.word)).sort((a,b)=>lastAsked(a)-lastAsked(b));if(!t.length){emptyTricky();return}items=shuffle(t.slice(0,ROUND))}
  else{const r=buildRound();items=r.items;mix=r.mix}
  const qs=items.map(e=>{
    const rev=mode==="reverse";
    const ans=rev?e.word:e.syn;
    const used=new Set([ans.toLowerCase()]);const opts=[ans];
    for(const d of shuffle(W)){
      if(opts.length===4)break;
      const t=rev?d.word:d.syn;
      if(used.has(t.toLowerCase())||same(t,e.word)||same(d.word,e.word))continue;
      used.add(t.toLowerCase());opts.push(t);
    }
    return {e,ans,opts:shuffle(opts)};
  });
  Q={qs,k:0,score:0,missed:[],answered:false,rev:mode==="reverse",mix};
  renderQ();
}
function renderQ(){
  const {qs,k,score,rev}=Q;const q=qs[k];const e=q.e;
  const pct=Math.round(k/qs.length*100);
  $("#stage").innerHTML=`
    <div class="meta"><span>Question ${k+1} of ${qs.length}</span><span>${Q.mix?mixLabel(Q.mix)+" · ":""}Score ${score}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    ${rev?`<p class="ask">${CHAPTER.reversePrompt(esc(e.syn))}</p>`
         :`<p class="sentence">${sentenceHTML(e)}</p><p class="ask">${CHAPTER.forwardPrompt(esc(e.word))} ${sayBtn(e.word)}</p>`}
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <p class="hint">Tip: press 1–4 to answer and Enter for the next question.</p>`;
  Q.answered=false;
}
function mixLabel(m){const p=[];if(m.nNew)p.push(m.nNew+" new");if(m.nTricky)p.push(m.nTricky+" tricky");if(m.nReview)p.push(m.nReview+" review");return p.join(", ")}
function owner(t,rev){ // which list entry does a wrong option belong to?
  return rev?W.find(x=>x.word===t):W.find(x=>x.syn===t);
}
function answer(o){
  if(Q.answered)return;Q.answered=true;
  const q=Q.qs[Q.k],e=q.e,ok=o===q.ans,rev=Q.rev;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=b.dataset.o;if(v===q.ans)b.classList.add("right");else if(v===o)b.classList.add("wrong")});
  const wasTricky=tricky.has(e.word);
  if(ok){Q.score++;}else{Q.missed.push(e)}
  const graduated=record(e.word,ok);fillSets();
  track.q(ok,e.word);
  let why="";
  if(!ok){const w=owner(o,rev);
    why= w? (rev?`<p>You picked <b>${esc(o)}</b>. That word means <b>${esc(w.syn)}</b>: ${esc(w.meaning)}.</p>`
                :`<p>You picked <b>${esc(o)}</b>${gloss(o)?`, which means ${esc(gloss(o))}`:""}. In this list it goes with <b>${esc(w.word)}</b>, not <b>${esc(e.word)}</b>.</p>`):"";}
  const praise=["Well done!","Correct!","Yes, that’s right!","Great job!","Spot on!"];
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">
     <h3>${ok?praise[Math.floor(Math.random()*praise.length)]:`Not quite. The answer is “${esc(q.ans)}”.`}</h3>
     <p><b>${esc(cap(e.word))}</b> means ${esc(e.meaning)}.</p>
     ${gloss(e.syn)?`<p><b>${esc(cap(e.syn))}</b> means ${esc(gloss(e.syn))}.</p>`:""}
     <p>So <b>${esc(e.word)}</b> and <b>${esc(e.syn)}</b> mean almost the same thing.</p>
     ${why}
     <p class="sentence" style="font-size:17px">${sentenceHTML(e,true)}</p>
     ${tipHTML(e)}
     ${graduated?`<p class="tip"><b>Nice!</b> Right twice in a row, so <b>${esc(e.word)}</b> is off your tricky list.</p>`
       :ok&&wasTricky?`<p class="tip"><b>Good!</b> Get <b>${esc(e.word)}</b> right once more to take it off your tricky list.</p>`
       :!ok?`<p class="tip"><b>${esc(e.word)}</b> is now on your tricky list. It will come back in later rounds.</p>`:""}
   </div>
   <div class="row" style="margin-top:12px"><button class="btn" id="next">${Q.k+1<Q.qs.length?"Next question":"See my score"}</button></div>`;
  $("#next").focus({preventScroll:true});
}
function next(){if(!Q||Q.k>=Q.qs.length)return; /* score screen already shown: extra Enter presses must not count the round again */ Q.k++;if(Q.k<Q.qs.length)renderQ();else results()}
function results(){
  const {score,qs,missed}=Q;const pct=score/qs.length;
  track.quiz();flush();
  const msg=pct===1?"Perfect score!":pct>=.8?"Excellent work!":pct>=.5?"Good effort. Keep practising!":"Keep going. Every try helps you remember!";
  fillSets();
  $("#stage").innerHTML=`
    <div class="row" style="justify-content:space-between"><div><div class="score">${score}/${qs.length}</div><p class="ask" style="margin-top:6px">${msg}</p></div></div>
    ${missed.length?`<div><p class="ask" style="font-size:18px">Words to look at again</p>
      <ul class="missed">${missed.map(e=>`<li><b>${esc(e.word)}</b> = <b style="color:var(--blue)">${esc(e.syn)}</b><br><span style="color:var(--muted)">${esc(cap(e.meaning))}.${gloss(e.syn)?` ${esc(cap(e.syn))}: ${esc(gloss(e.syn))}.`:""}</span></li>`).join("")}</ul>
      <p class="hint" style="margin-top:8px">These are on your tricky list. They will come back in later rounds until you get each one right twice in a row.</p></div>`:""}
    <div class="row">
      <button class="btn" id="again">Next round</button>
      ${missed.length?`<button class="btn ghost" id="redo">Practise these again</button>`:""}
    </div>`;
  $("#again").onclick=startQuiz;
  if(missed.length)$("#redo").onclick=()=>{const m=missed.slice();Q={qs:shuffle(m).map(e=>{const old=qs.find(x=>x.e===e);return {...old,opts:shuffle(old.opts)}}),k:0,score:0,missed:[],answered:false,rev:Q.rev};renderQ()};
}
function emptyTricky(){
  $("#stage").innerHTML=`<p class="ask">No tricky words yet</p><p>Words you get wrong in a quiz, or mark “Still learning” on a flashcard, are saved here so you can practise them again. Choose another option above to start.</p>`;
}

/* ---------- flashcards ---------- */
let F=null;
function startLearn(){const p=pool();if(!p.length){emptyTricky();return}F={items:p.slice(),k:0,flip:false};renderF()}
function renderF(){
  const e=F.items[F.k];
  $("#stage").innerHTML=`
    <div class="meta"><span>Card ${F.k+1} of ${F.items.length}</span><span>${tricky.has(e.word)?"In my tricky words":""}</span></div>
    <button class="flash" id="card" aria-label="Flip card">
      <p class="big">${esc(e.word)}</p>
      ${F.flip?`<span class="eq">means about the same as</span><p class="syn">${esc(e.syn)}</p>${gloss(e.syn)?`<p class="mean" style="font-size:15px;color:var(--muted)">(${esc(e.syn)}: ${esc(gloss(e.syn))})</p>`:""}
        <p class="mean">${esc(cap(e.meaning))}.</p><p class="sentence" style="font-size:18px">${sentenceHTML(e)}</p>${e.note?`<p class="mean" style="font-size:15px;color:var(--muted)">${esc(e.note)}</p>`:""}`
      :`<span class="eq">Can you think of a word that means the same? Tap to check.</span>`}
    </button>
    <div class="row" style="justify-content:space-between">
      <div class="row">${sayBtn(e.word)}<button class="btn ghost" id="prev">Back</button><button class="btn ghost" id="shuf">Shuffle</button></div>
      <div class="row">${F.flip?`<button class="btn ghost" id="learning">Still learning</button><button class="btn" id="know">I knew it</button>`:`<button class="btn" id="flip">Show answer</button>`}</div>
    </div>`;
  $("#card").onclick=()=>{F.flip=!F.flip;if(F.flip)track.flip();renderF()};
  $("#prev").onclick=()=>{F.k=(F.k-1+F.items.length)%F.items.length;F.flip=false;renderF()};
  $("#shuf").onclick=()=>{F.items=shuffle(F.items);F.k=0;F.flip=false;renderF()};
  if(F.flip){
    $("#know").onclick=()=>adv();
    $("#learning").onclick=()=>{loadL();tricky.add(e.word);saveTricky();adv()};
  }else $("#flip").onclick=()=>{F.flip=true;track.flip();renderF()};
}
function adv(){track.card();F.fc=false;fillSets();F.k=(F.k+1)%F.items.length;F.flip=false;renderF()}

/* ---------- word list ---------- */
function startList(){
  $("#stage").innerHTML=`<input type="search" id="q" placeholder="Search a word or meaning" aria-label="Search">
    <p class="hint" id="count"></p><ul class="wl" id="wl"></ul>`;
  const draw=()=>{const t=$("#q").value.trim().toLowerCase();
    const items=pool().filter(e=>!t||e.word.includes(t)||e.syn.includes(t)||e.meaning.toLowerCase().includes(t));
    $("#count").textContent=`${items.length} word${items.length===1?"":"s"}. Tap “Tricky” to save a word for extra practice.`;
    $("#wl").innerHTML=items.map(e=>`<li><div class="pair"><b>${esc(e.word)}</b> = <span>${esc(e.syn)}</span></div>
      <button class="star" data-star="${esc(e.word)}" aria-pressed="${tricky.has(e.word)}">Tricky</button>
      <div class="m"><b>${esc(e.word)}</b>: ${esc(e.meaning)}.${gloss(e.syn)?` <b>${esc(e.syn)}</b>: ${esc(gloss(e.syn))}.`:""}<br><i>${esc(e.sentence.replace(/[{}]/g,""))}</i>${e.note?` <br>Tip: ${esc(e.note)}`:""}</div></li>`).join("");};
  $("#q").oninput=draw;draw();
}


/* ---------- usage tracking ---------- */
const UKEY=CHAPTER.key+"-usage"+(HOSTED&&LEARNER?"-"+LEARNER.toLowerCase():"");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let U={days:{}};try{U=JSON.parse(localStorage.getItem(UKEY)||'{"days":{}}')}catch(e){}
let DEV="";try{DEV=localStorage.getItem("vocab-device")||"";if(!DEV){DEV=Math.random().toString(36).slice(2,10);localStorage.setItem("vocab-device",DEV)}}catch(e){DEV=Math.random().toString(36).slice(2,10)}
const loadU=()=>{try{const x=JSON.parse(localStorage.getItem(UKEY)||"null");if(x&&x.days)U=x}catch(e){}};
/* re-read before every change, so two open tabs add to each other instead of overwriting */
const day=(k=today())=>{loadU();return U.days[k]||(U.days[k]={questions:0,correct:0,cards:0,quizzes:0,seconds:0,missed:[]})};
const saveU=()=>{try{localStorage.setItem(UKEY,JSON.stringify(U))}catch(e){}};
let DB=null,dirty=false,writing=false,REMOTE=null,remoteState="loading";
const track={
  q(ok,word){const d=day();d.questions++;const tq=d.tq||(d.tq={});tq[mode]=(tq[mode]||0)+1;if(ok)d.correct++;else if(!d.missed.includes(word)){d.missed.push(word);if(d.missed.length>60)d.missed.shift()}saveU();dirty=true;scheduleSave()},
  card(){day().cards++;saveU();dirty=true;scheduleSave()},
  flip(){if(F.fc)return;F.fc=true;const d=day();d.flips=(d.flips||0)+1;saveU();dirty=true;scheduleSave()},
  quiz(){day().quizzes++;saveU();dirty=true;flush()}
};
/* ---------- time ----------
   Active time: the page is on screen and was tapped/scrolled/typed on within the idle limit.
   On-screen time: the page is on screen at all. Both are worked out from timestamps, so a
   browser that runs timers late cannot lose time. Each visit is logged as a session. */
const IDLE=()=>mode==="list"||mode==="progress"?90000:30000, SESS_GAP=600000, STEP_MAX=120000;
const TAB=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r1=x=>Math.round(x*10)/10;
let lastAct=Date.now(),lastT=Date.now(),onScreen=document.visibilityState==="visible",sess=null,sessN=0;
function accrue(){
  const now=Date.now(),from=lastT;lastT=now;
  if(!onScreen||now<=from)return;
  const step=now-from;if(step>STEP_MAX)return; // page was frozen (device asleep): count nothing
  const act=Math.max(0,Math.min(now,lastAct+IDLE())-from)/1000,vis=step/1000;
  if(!sess||from-sess.b>SESS_GAP)sess={id:TAB+"-"+(++sessN),a:from,b:now};else sess.b=now;
  const d=day();
  d.seconds=r1((d.seconds||0)+act);d.vis=r1((d.vis||0)+vis);
  const t=d.tabs||(d.tabs={});t[mode]=r1((t[mode]||0)+act);
  const ss=d.sess||(d.sess=[]);let e=ss.find(x=>x.id===sess.id);
  if(!e){e={id:sess.id,a:sess.a,b:now,act:0,vis:0};ss.push(e);if(ss.length>40)ss.shift()}
  e.b=now;e.act=r1(e.act+act);e.vis=r1(e.vis+vis);
  saveU();dirty=true;
}
["pointerdown","keydown","scroll"].forEach(ev=>addEventListener(ev,()=>{accrue();lastAct=Date.now()},{passive:true,capture:true}));
setInterval(accrue,5000);
let saveState="checking",saveErr="",savedAt=null,pendingSave=false,saveTimer=null;
function saveNote(){const el=document.getElementById("saveNote");if(!el)return;
  const t=savedAt?savedAt.toLocaleTimeString("en-SG",{hour:"numeric",minute:"2-digit"}):"";
  el.className="savenote "+saveState;
  el.textContent=saveState==="checking"?"Checking where progress is saved…"
    :saveState==="local"?(HOSTED?"Progress is saved on this device only.":"Not signed in to Claude: progress is saved on this device only.")
    :saveState==="saving"?(HOSTED?`Saving progress for ${LEARNER}…`:"Saving progress to your account…")
    :saveState==="saved"?`Progress saved ${HOSTED?"online for "+LEARNER:"to your account"}${t?" at "+t:""}.`
    :saveState==="ready"?(HOSTED?`Practising as ${LEARNER}: progress is saved online.`:"Signed in: progress will be saved to your account.")
    :`Couldn’t save to your account (${saveErr}). Progress is kept on this device for now; it will retry.${HOSTED?"":" If the page says “Can view” at the top, ask for edit access."}`}
function scheduleSave(){if(!DB)return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
const writeDay=(k,d)=>DB.doc("usage/"+k+"_"+DEV).set({date:k,device:DEV,chapter:CHAPTER.num,questions:d.questions,correct:d.correct,cards:d.cards,quizzes:d.quizzes,seconds:d.seconds,vis:d.vis||0,sess:(d.sess||[]).map(({a,b,act,vis})=>({a,b,act,vis})),tabs:d.tabs||{},tq:d.tq||{},flips:d.flips||0,missed:(d.missed||[]).slice(-60),updatedAt:new Date().toISOString()});
/* earlier days (last 7) that were never confirmed as saved online */
const unsentDays=()=>{loadU();const t=today(),lim=new Date(Date.now()-7*864e5).toISOString().slice(0,10);return Object.keys(U.days).filter(k=>k<t&&k>=lim&&!(U.synced&&U.synced[k]))};
async function flush(){
  if(!DB)return;
  if(writing){pendingSave=true;return}
  if(!learnerDirty&&!dirty)return;
  writing=true;pendingSave=false;saveState="saving";saveNote();
  const errs=[];
  if(dirty){dirty=false;const k=today();
    try{await writeDay(k,day(k))}
    catch(e){dirty=true;errs.push("daily record: "+((e&&(e.code||e.message))||"unknown"))}}
  for(const k of unsentDays()){try{await writeDay(k,day(k));loadU();(U.synced||(U.synced={}))[k]=1;saveU()}catch(e){}}
  if(learnerDirty){learnerDirty=false;loadL();
    try{await DB.doc("learner/main").set({items:Object.entries(L.seen).map(([k,v])=>({k,n:v.n||0,o:v.ok||0,s:v.streak||0,t:v.last||0})),tricky:[...tricky],updatedAt:L.updatedAt||Date.now()})}
    catch(e){learnerDirty=true;errs.push("word progress: "+((e&&(e.code||e.message))||"unknown"))}}
  if(errs.length){saveState="error";saveErr=errs.join("; ");setTimeout(flush,15000)}
  else{saveState="saved";savedAt=new Date();saveErr=""}
  writing=false;saveNote();
  if(pendingSave)flush();
}
document.addEventListener("visibilitychange",()=>{accrue();onScreen=document.visibilityState==="visible";lastT=Date.now();if(onScreen)lastAct=Date.now();else flush()});
addEventListener("pagehide",()=>{accrue();flush()});
(async()=>{
  try{if(!HOSTED){DB=await window.claude.use("db")}
    else if(LEARNER){DB=supaDB(LEARNER)}
    else{saveState="local";saveNote();remoteState="none";return}
    if(!DB){saveState="local";saveNote();remoteState="none";if(mode==="progress")startProgress();return}
    saveState="ready";saveNote();
    const timer=setTimeout(()=>{if(remoteState==="loading"){remoteState="slow";if(mode==="progress")startProgress()}},10000);
    DB.collection("usage").onSnapshot(s=>{
      if(!s.metadata?.fromCache){clearTimeout(timer)}
      REMOTE=s.docs.map(x=>x.data());remoteState="ok";if(mode==="progress")startProgress();
    },()=>{clearTimeout(timer);remoteState="none";if(mode==="progress")startProgress()});
    try{const s=await DB.doc("learner/main").get();const r=s.exists?s.data():null;
      let rs=null;if(r&&Array.isArray(r.items)){rs={};r.items.forEach(it=>{if(Array.isArray(it)){const [k,n,ok,streak,last]=it;rs[k]={n,ok,streak,last}}else if(it&&it.k)rs[it.k]={n:it.n,ok:it.o,streak:it.s,last:it.t}})}else if(r&&r.seen)rs=r.seen;
      if(rs&&(r.updatedAt||0)>(L.updatedAt||0)){L={seen:rs,tricky:r.tricky||[],updatedAt:r.updatedAt};tricky=new Set(L.tricky);try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){}fillSets();if(!Q||(Q.k===0&&!Q.answered))go()}
      else if(L.updatedAt)learnerDirty=true;
    }catch(e){}
    const dd=day();if(dd.questions||dd.cards||dd.seconds||dd.vis)dirty=true;if(unsentDays().length)dirty=true;flush();
  }catch(e){saveState="error";saveErr=(e&&(e.code||e.message))||"unknown";saveNote();remoteState="none"}
})();
const fmtTime=s=>{s=Math.round(s);if(s<60)return s?s+" sec":"0 min";const m=Math.round(s/60);return m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min"};
function rows(){ // per-day totals, all devices
  const by={};
  const add=(k,d)=>{const r=by[k]||(by[k]={date:k,questions:0,correct:0,cards:0,quizzes:0,seconds:0,missed:new Set()});
    r.questions+=d.questions||0;r.correct+=d.correct||0;r.cards+=d.cards||0;r.quizzes+=d.quizzes||0;r.seconds+=d.seconds||0;(d.missed||[]).forEach(w=>r.missed.add(w))};
  if(REMOTE){REMOTE.forEach(d=>{if(d.device!==DEV)add(d.date,d)})}
  Object.entries(U.days).forEach(([k,d])=>add(k,d)); // this device: local copy is always the freshest
  return Object.values(by).sort((a,b)=>a.date<b.date?1:-1);
}
function sum(rs){return rs.reduce((a,r)=>({questions:a.questions+r.questions,correct:a.correct+r.correct,cards:a.cards+r.cards,seconds:a.seconds+r.seconds,days:a.days+1}),{questions:0,correct:0,cards:0,seconds:0,days:0})}
function tile(lab,s){const acc=s.questions?Math.round(s.correct/s.questions*100)+"% correct":"no questions yet";
  return `<div class="tile"><span class="lab">${lab}</span><span class="val">${fmtTime(s.seconds)}</span><span class="det">${s.questions} questions · ${acc}</span><span class="det">${s.cards} flashcard${s.cards===1?"":"s"}</span></div>`}
function startProgress(){
  flush();
  const rs=rows();const t=today();
  const wk=new Date();wk.setDate(wk.getDate()-6);const wkey=wk.getFullYear()+"-"+String(wk.getMonth()+1).padStart(2,"0")+"-"+String(wk.getDate()).padStart(2,"0");
  const src=remoteState==="ok"?"Practice from every device that opens this page is added up here."
    :remoteState==="loading"?"Loading practice from other devices…"
    :remoteState==="slow"?"Can’t reach saved practice from other devices right now. Showing this device only."
    :"Showing practice on this device only.";
  const nice=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"})};
  $("#stage").innerHTML=`
    <p class="ask">Practice record</p>
    <p style="margin:0">Words practised: <b>${Object.keys(L.seen).length}</b> of ${W.length} · Tricky right now: <b>${tricky.size}</b> · Learned (right and not tricky): <b>${W.filter(e=>L.seen[e.word]&&!tricky.has(e.word)&&L.seen[e.word].ok>0).length}</b></p>
    <div class="tiles">${tile("Today",sum(rs.filter(r=>r.date===t)))}${tile("Last 7 days",sum(rs.filter(r=>r.date>=wkey)))}${tile("All time",sum(rs))}</div>
    ${rs.length?`<div class="tbl"><table><thead><tr><th>Day</th><th class="n">Time</th><th class="n">Qns</th><th class="n">Right</th><th class="n">Cards</th></tr></thead><tbody>
      ${rs.map(r=>`<tr><td>${nice(r.date)}</td><td class="n">${fmtTime(r.seconds)}</td><td class="n">${r.questions}</td><td class="n">${r.questions?Math.round(r.correct/r.questions*100)+"%":"–"}</td><td class="n">${r.cards}</td></tr>${r.missed.size?`<tr><td colspan="5" style="font-size:14px;color:var(--muted);padding-top:0">Missed: ${esc([...r.missed].slice(0,15).join(", "))}${r.missed.size>15?` and ${r.missed.size-15} more`:""}</td></tr>`:""}`).join("")}
      </tbody></table></div>`:`<p>No practice recorded yet. Time counts while the page is open and being used; each answered question and flashcard is added here.</p>`}
    <p class="src">${src} Time only counts while the page is open and being used (it pauses after 30 seconds with no taps, or 90 seconds on the word list).</p>`;
}

/* ---------- wiring ---------- */
function go(){
  if(HOSTED&&!LEARNER){namePrompt();return}
  try{localStorage.setItem(CHAPTER.key+"-mode",mode)}catch(e){}
  fillSets();
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  const quizish=mode==="quiz"||mode==="reverse";
  $("#bar").hidden=mode==="progress";$("#status").hidden=mode==="progress";flush();
  if(mode==="progress"){startProgress();return}
  if(quizish)startQuiz();else if(mode==="learn")startLearn();else startList();
}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;setSel="";go()});
$("#set").onchange=e=>{setSel=e.target.value;go()};
document.addEventListener("click",ev=>{
  const o=ev.target.closest(".opt");if(o&&Q){answer(o.dataset.o);return}
  if(ev.target.closest("#next")){next();return}
  const s=ev.target.closest("[data-say]");if(s){ev.stopPropagation();say(s.dataset.say);return}
  const st=ev.target.closest("[data-star]");if(st){const w=st.dataset.star;loadL();tricky.has(w)?tricky.delete(w):tricky.add(w);saveTricky();st.setAttribute("aria-pressed",tricky.has(w));fillSets();}
},true);
document.addEventListener("keydown",ev=>{
  if(!(mode==="quiz"||mode==="reverse")||!Q||ev.target.tagName==="INPUT"||ev.target.tagName==="SELECT")return;
  if(!Q.answered&&/^[1-4]$/.test(ev.key)){const b=document.querySelectorAll(".opt")[+ev.key-1];if(b)answer(b.dataset.o)}
  else if(Q.answered&&ev.key==="Enter"&&document.activeElement?.id!=="next"){ev.preventDefault();next()}
});

$("#title").textContent=CHAPTER.title;
$("#sub").textContent=`Chapter ${CHAPTER.num} · ${W.length} words · ${CHAPTER.pages}`;
$("#rule").innerHTML=CHAPTER.rule;
$("#foot").textContent=`Words from Chapter ${CHAPTER.num} (${CHAPTER.pages}). Meanings and example sentences are written in simple English for practice.`;
if(HOSTED){const w=$("#who");w.hidden=false;w.innerHTML=(LEARNER?`Practising as <b>${esc(LEARNER)}</b> · <button id="chg">Change name</button> · `:"")+`<a href="index.html">All chapters</a>`;const c=$("#chg");if(c)c.onclick=()=>{try{localStorage.removeItem("vocab-learner")}catch(e){}location.reload()}}
fillSets();go();
})();
</script>
</body></html>
